<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a2822">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Armonia">
<title>Armonia Thassos</title>
<style>
  /* ── Shell tokens — Pine & mineral (Thassos) ───────────────────────── */
  :root{
    --bg:#e9ece8;
    --bg-deep:#d4dbd5;
    --card:rgba(255,255,255,.82);
    --ink:#1a2822;
    --muted:#455851;
    --muted-soft:#4a6a74;
    --meta:#6b8a94;
    --line:rgba(26,40,34,.12);
    --brand:#2a6b52;
    --brand-2:#3d8a6a;
    --sun:#c48a1a;
    --sea:#2f5a63;
    --in:#2a6b52;
    --out:#c2410c;
    --warn:#a16207;
    --radius:18px;
    --radius-sm:12px;
    --radius-dock:24px;
    --shadow:0 14px 36px rgba(26,40,34,.08);
    --glass:rgba(255,255,255,.64);
    --glass-strong:rgba(255,255,255,.86);
    --glass-edge:rgba(255,255,255,.55);
    --chrome:rgba(26,40,34,.78);
    --mark-a:#9bc4b0;
    --mark-b:#7a9eaa;
    --font-ui:"Outfit",system-ui,sans-serif;
    --font-display:"Fraunces",Georgia,"Times New Roman",serif;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --header-h: 60px;
    --topbar-tools-h: 0px;
    --nav-h: 64px;
    --nav-inset: 10px;
    --nav-total: calc(var(--nav-h) + var(--nav-inset) + var(--safe-b));
    --rail-w: 0px;
    --dock-h: 0px;
    --chat-h: 0px;
    --fab-size: 52px;
    --side-gutter: max(12px, calc((100vw - 1180px) / 2 + 12px));
    --ease-out: cubic-bezier(.2,.8,.3,1);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html{touch-action:manipulation}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font:16px/1.45 var(--font-ui);
    overscroll-behavior-x:none;
    font-optical-sizing:auto}
  @media(min-width:900px){
    html,body{font-size:14px}
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
    background:
      radial-gradient(ellipse 100% 60% at 110% -8%, rgba(196,138,26,.18), transparent 52%),
      radial-gradient(ellipse 80% 55% at -15% 25%, rgba(42,107,82,.16), transparent 48%),
      radial-gradient(ellipse 55% 40% at 50% 110%, rgba(47,90,99,.1), transparent 55%),
      linear-gradient(168deg, #f3f5f2 0%, #e6ebe6 45%, #d5dbd4 100%);
  }
  body::after{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.035;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  /* iOS Safari zooms inputs under 16px — keep all editable fields at 16px */
  input,select,textarea,.qty-field,.cart-qty-input,.pin-input,input[type="date"],input[type="number"],input[type="text"],input[type="email"],input[type="search"],input[type="tel"]{
    font-size:16px!important}
  /* Boot: only the login gate — no app chrome flash */
  html:has(body.auth-pending), body.auth-pending{
    background:#121c18!important; color:#fff;
  }
  body.auth-pending > *:not(#gate):not(#toast){display:none!important}
  body.auth-pending #gate{display:block!important}
  body.auth-pending #toast{display:block!important;z-index:90;bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  body.auth-pending #app[hidden]{display:none!important}
  body.auth-pending #gate::before,
  body.auth-pending #gate::after{content:none!important;display:none!important;animation:none!important}
  #app.app-shell{max-width:1180px; margin:0 auto; min-height:100dvh;
    padding-bottom:calc(var(--nav-total) + var(--dock-h) + var(--fab-clear, 0px) + var(--chat-h) + 24px);
    display:flex; flex-direction:column}
  header.app-chrome{position:sticky; top:0; z-index:20;
    color:#fff; padding:calc(8px + var(--safe-t)) 14px 10px;
    display:flex; flex-direction:column; gap:8px;
    min-height:calc(var(--header-h) + var(--safe-t));
    background:var(--chrome);
    border-bottom:1px solid rgba(255,255,255,.1);
    box-shadow:0 18px 40px rgba(26,40,34,.22);
    backdrop-filter:blur(22px) saturate(1.35); -webkit-backdrop-filter:blur(22px) saturate(1.35)}
  header.app-chrome::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(120deg, rgba(155,196,176,.12), transparent 42%, rgba(56,189,248,.08));
    opacity:.9}
  .topbar-row{display:flex; align-items:center; gap:8px; min-width:0; position:relative; z-index:1}
  .chrome-brand{display:flex; align-items:center; gap:8px; flex:1; min-width:0}
  .brand-mark{flex:0 0 auto; width:36px; height:36px; border-radius:10px;
    display:grid; place-items:center; font-family:var(--font-display); font-weight:800; font-size:16px;
    color:#1a2822; background:linear-gradient(145deg,var(--mark-a),var(--mark-b));
    box-shadow:0 8px 18px rgba(155,196,176,.28), inset 0 1px 0 rgba(255,255,255,.45)}
  .brand-copy{min-width:0; flex:1}
  .brand-kicker-live{display:block; font-size:11px; font-weight:750; letter-spacing:.16em;
    text-transform:uppercase; color:#9bc4b0; margin:0 0 1px; line-height:1.1}
  header h1{font-family:var(--font-display); font-size:clamp(16px,4vw,19px); margin:0; font-weight:750;
    letter-spacing:-.03em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.15}
  header .who{font-size:12px; opacity:.9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#b5c9bf}
  .topbar-core{flex:0 0 auto; max-width:46%}
  @media(max-width:380px){
    .brand-kicker-live{font-size:11px; letter-spacing:.12em}
    header .who{display:none}
    .topbtn{padding:8px 10px; min-height:44px; min-width:44px}
    .brand-mark{width:32px;height:32px;font-size:14px;border-radius:10px}
  }
  .topbar-core,.topbar-tools{display:flex; gap:4px; align-items:center; flex-wrap:nowrap;
    overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; padding-bottom:1px;
    position:relative; z-index:1}
  .topbar-core::-webkit-scrollbar,.topbar-tools::-webkit-scrollbar{display:none}
  .topbar-tools{width:100%; padding-top:6px; border-top:1px solid rgba(255,255,255,.12)}
  /* Staff: actions live in the page, not the sticky header. */
  body:not(.mode-child) .topbar-tools{display:none!important}
  body:not(.mode-child) header.app-chrome{padding:calc(8px + var(--safe-t)) 14px 10px; gap:0}
  .page-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:0 0 12px;
    max-width:100%}
  .page-act{flex:0 0 auto; border:1px solid var(--line); background:var(--glass-strong); color:var(--ink);
    border-radius:var(--radius-sm); padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer;
    min-height:44px; white-space:nowrap; touch-action:manipulation;
    box-shadow:var(--shadow); max-width:100%; overflow:hidden; text-overflow:ellipsis;
    backdrop-filter:blur(10px)}
  .page-act:active{transform:scale(.98)}
  .page-act.on,.page-act.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2)); border-color:transparent; color:#fff;
    box-shadow:0 10px 24px rgba(42,107,82,.28)}
  .page-act.ghost{background:#fff; color:var(--ink); border-color:var(--line)}
  .shop-bar .page-actions{margin:10px 0 0}
  .stock-command,.shop-command{
    position:sticky; top:calc(var(--header-h) + 2px); z-index:14;
    display:grid; gap:8px; margin:0 0 10px; padding:8px;
    border:1px solid var(--line); border-radius:14px;
    background:rgba(244,250,251,.97); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    box-shadow:0 8px 20px rgba(26,40,34,.06)}
  body.layout-desktop .stock-command,body.layout-desktop .shop-command{top:calc(var(--header-h) + 8px)}
  .stock-command .seg,.shop-command .seg{margin:0; background:rgba(47,90,99,.1)}
  .stock-command-row,.shop-command-row{display:flex; align-items:center; gap:4px; min-width:0}
  .stock-command-row .stock-search{flex:1; min-width:0; margin:0}
  .shop-command-row .friday-picker{flex:1; min-width:0; margin:0}
  .stock-tool,.shop-tool{
    flex:0 0 auto; width:44px; height:44px; padding:0; border:1px solid var(--line);
    border-radius:10px; background:#fff; color:#1a2822; font-size:16px; font-weight:800;
    cursor:pointer; touch-action:manipulation; display:grid; place-items:center}
  .stock-tool.labeled,.shop-tool.labeled{
    width:auto; min-width:44px; padding:0 10px; grid-auto-flow:column; gap:4px;
    font-size:12px; font-weight:750; white-space:nowrap}
  .stock-tool.on{background:#1a2822; color:#fff; border-color:#1a2822}
  .stock-tool:active,.shop-tool:active{transform:scale(.94)}
  .shop-tools{display:flex; gap:4px; flex:0 0 auto}
  .stock-command .stock-strip-stats{margin:0}
  .stock-command .stock-chip{height:32px; padding:0 9px}
  .book-toolbar{margin:0 0 12px}
  .book-page{display:grid;gap:12px}
  .book-hero{
    padding:16px 16px;border-radius:20px;color:#fff;
    background:
      radial-gradient(circle at 12% 80%, rgba(155,196,176,.22), transparent 40%),
      linear-gradient(145deg,#1a2822 0%,#2a4a40 42%,#3a5a64 100%);
    box-shadow:0 14px 32px rgba(26,40,34,.16)}
  .book-hero .brand-kicker{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#9bc4b0}
  .book-hero h2{margin:4px 0 6px;font-family:var(--font-display);font-size:clamp(22px,5vw,28px);letter-spacing:-.03em}
  .book-hero p{margin:0;color:#c5d5cc;font-size:13px;max-width:44ch;line-height:1.45}
  .book-panes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:rgba(26,40,34,.06);border:1px solid var(--line)}
  .book-pane-btn{appearance:none;border:1px solid transparent;background:#fff;color:var(--ink);font:inherit;font-weight:750;font-size:12px;padding:8px 8px;border-radius:10px;cursor:pointer;min-height:44px}
  .book-pane-btn.on{background:#fff;color:var(--ink);border-color:var(--line);box-shadow:0 4px 14px rgba(26,40,34,.1)}
  .book-filters{display:grid;gap:12px}
  .book-filter-block{display:grid;gap:4px}
  .book-filter-label{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#6b8a94}
  .book-chips{display:flex;flex-wrap:wrap;gap:4px}
  .book-chips-scroll{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;scrollbar-width:none}
  .book-chips-scroll::-webkit-scrollbar{display:none}
  .book-chip{appearance:none;border:1px solid var(--line);background:#fff;color:#2d4a52;font:inherit;font-size:12px;font-weight:700;padding:8px 11px;border-radius:999px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;min-height:36px}
  .book-chip.on{background:#1a2822;border-color:#1a2822;color:#fff}
  .book-chip.ghost{background:#f2f4f1}
  .book-chip.ghost.on{background:#2f5a63;border-color:#2f5a63}
  .book-chip-who{padding-left:8px}
  .book-chip-av{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff}
  .book-search{display:flex;align-items:center;gap:8px;padding:0 12px;height:44px;border:1px solid var(--line);border-radius:10px;background:#f7f9f7}
  .book-search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;outline:none}
  .book-search button{border:0;background:transparent;font-size:18px;line-height:1;color:#6b8a94;cursor:pointer;padding:4px}
  .book-clear{justify-self:start}
  .book-panel{padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}
  .book-panel-head{margin-bottom:8px;align-items:center}
  .book-panel-head h2{margin:0;font-size:16px;letter-spacing:-.02em}
  .book-log-text{margin-top:4px;font-size:13px;line-height:1.45;color:#1a2822}
  .book-log-stamp,.book-log-tech{font-size:11px;margin-top:2px}
  .book-day-group{margin-bottom:12px}
  .book-day-title{margin:0 0 8px;font-size:13px;font-weight:800;color:#2f5a63}
  .book-compact{display:grid;gap:4px}
  .book-compact-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;width:100%;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#f7f9f7;font:inherit}
  .book-compact-text{font-size:12px;color:#1a2822;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .book-compact-who,.book-compact-time{font-size:11px;white-space:nowrap}
  .book-people{display:grid;gap:4px}
  .book-person{width:100%;text-align:left}
  .book-shift-hint{margin:0 0 10px;color:#4a6a74;font-size:12px;line-height:1.45}
  .book-shift-team{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .book-shift-note{cursor:default;margin-bottom:8px}
  .book-foot{margin-top:12px;display:grid;gap:8px}
  .book-foot .muted{text-align:center;margin:0;font-size:11px}
  .book-hero.journal{
    background:
      radial-gradient(circle at 88% 12%, rgba(197,221,208,.3), transparent 36%),
      linear-gradient(145deg,#14201c 0%,#243f36 46%,#2f5648 100%)}
  .journal-book{display:grid;gap:12px}
  .journal-duty{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:12px 14px;border-radius:14px;font-size:13px;font-weight:750}
  .journal-duty.must{background:linear-gradient(135deg,var(--amber-tint),#fff);border:1px solid rgba(180,83,9,.35);color:var(--out)}
  .journal-duty.ok{background:linear-gradient(135deg,var(--pine-tint),#fff);border:1px solid rgba(42,107,82,.28);color:#166534}
  .journal-duty-home{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;
    border:1px solid rgba(180,83,9,.35);border-radius:14px;cursor:pointer;font:inherit;
    background:linear-gradient(135deg,var(--amber-tint),#fff);box-shadow:var(--shadow);touch-action:manipulation}
  .journal-duty-home-mark{
    width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;
    background:var(--out);color:#fff;font-weight:850}
  .journal-duty-home .grow{min-width:0;flex:1}
  .journal-duty-home b{display:block;font-size:13px;color:var(--out)}
  .journal-duty-home small{display:block;margin-top:2px;font-size:11px;color:#7c4a1e;line-height:1.35}
  .journal-duty-home-cta{flex:0 0 auto;font-size:12px;font-weight:800;color:#1a2822;background:#c5ddd0;padding:8px 12px;border-radius:10px}
  .home-shift-start{
    position:relative;overflow:hidden;padding:var(--space-4);border-radius:var(--radius);color:var(--ink);
    background:var(--glass);border:1px solid var(--line);border-left:3px solid var(--brand);
    box-shadow:var(--shadow-1);animation:journalOpen .4s var(--ease-out) both}
  .home-shift-start.late{border-left-color:var(--out);background:linear-gradient(var(--out-tint),var(--out-tint)),var(--glass)}
  .home-shift-start.done{border-left-color:var(--in);background:linear-gradient(var(--pine-tint),var(--pine-tint)),var(--glass)}
  .home-shift-start-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .home-shift-kicker{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--brand)}
  .home-shift-start.late .home-shift-kicker{color:var(--out)}
  .home-shift-start h2{margin:4px 0 4px;font-family:var(--font-display);font-size:clamp(20px,5vw,26px);letter-spacing:-.03em;line-height:1.15;color:var(--ink)}
  .home-shift-start-head p{margin:0;color:var(--muted);font-size:13px;line-height:1.4;max-width:36ch}
  .home-shift-start.late .home-shift-start-head p{color:var(--out)}
  .home-shift-primary{
    flex:0 0 auto;appearance:none;border:0;border-radius:10px;padding:12px 14px;min-height:44px;
    font:inherit;font-weight:800;cursor:pointer;color:#fff;
    background:var(--brand);box-shadow:0 8px 20px color-mix(in srgb, var(--brand) 28%, transparent)}
  .home-shift-start.late .home-shift-primary{background:var(--out)}
  .home-shift-hint{margin:10px 0 0;font-size:12px;color:var(--meta);line-height:1.4}
  .home-shift-steps{display:grid;gap:4px;margin-top:12px}
  .home-shift-step{
    display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;
    padding:8px 12px;border-radius:10px;background:var(--glass-strong);border:1px solid var(--line)}
  .home-shift-step.ok{background:var(--pine-tint);border-color:color-mix(in srgb, var(--in) 30%, transparent)}
  .home-shift-mark{
    width:28px;height:28px;border-radius:10px;display:grid;place-items:center;
    background:var(--glass);border:1px solid var(--line);font-weight:850;font-size:13px;color:var(--muted)}
  .home-shift-step.ok .home-shift-mark{background:var(--in);color:#fff;border-color:transparent}
  .home-shift-step-label{font-size:13px;font-weight:700;color:var(--ink)}
  .home-shift-step-done{font-size:11px;font-weight:750;color:var(--in)}
  .home-shift-step-cta{
    appearance:none;border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-height:36px;
    font:inherit;font-size:12px;font-weight:800;cursor:pointer;color:var(--ink);background:#fff}
  .home-shift-step-cta.primary{background:var(--brand);color:#fff;border-color:transparent}
  .home-shift-start.late .home-shift-step-cta.primary{background:var(--out);color:#fff}
  .cal-sheet{display:grid;gap:12px}
  .cal-sheet-hint{margin:0;line-height:1.45;font-size:13px}
  .cal-block{padding:12px;border:1px solid var(--line);border-radius:14px;background:#f7f9f7;display:grid;gap:8px}
  .cal-block h4{margin:0;font-family:var(--font-display);font-size:14px;letter-spacing:-.02em}
  .cal-block .muted{margin:0;font-size:12px;line-height:1.4}
  .cal-reminder{margin:0;font-size:11px;font-weight:700;color:#2f5a63}
  .cal-actions{display:grid;gap:8px}
  .cal-actions.row{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cal-actions .btn,.cal-actions a.btn{margin:0;text-align:center;text-decoration:none}
  .cal-next-card{padding:8px 12px;border-radius:10px;background:#fff;border:1px solid var(--line)}
  .cal-next-card b{display:block;font-size:13px}
  .cal-next-card span{display:block;margin-top:2px;font-size:11px;color:#6b8a94}
  .cal-upcoming{display:grid;gap:8px;max-height:min(42vh,320px);overflow:auto}
  .cal-up-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px;border-radius:10px;background:#fff;border:1px solid var(--line)}
  .cal-up-row b{display:block;font-size:12px}
  .cal-up-acts{display:flex;flex-wrap:wrap;gap:4px}
  .cal-up-acts .btn{margin:0;width:auto}
  .presence-panel{display:grid;gap:8px}
  .presence-panel h2{margin:0;font-family:var(--font-display);font-size:clamp(22px,5vw,28px);letter-spacing:-.03em}
  .presence-kicker{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#2f5a63}
  .presence-panel.late .presence-kicker{color:var(--out)}
  .presence-meta{margin:0;color:#4a6a74;font-size:13px}
  .presence-ready-copy{margin:0;font-size:14px;line-height:1.45;color:#2d4a52}
  .presence-late-box{padding:12px;border-radius:14px;border:1px solid rgba(180,83,9,.35);background:var(--amber-tint)}
  .presence-late-box b{display:block;color:var(--out);font-size:14px}
  .presence-late-box p{margin:4px 0 10px;font-size:12px;color:#7c4a1e;line-height:1.4}

  .block-h .t{font-size:13px; font-weight:700; letter-spacing:-.01em}

  .house-h{font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase;
    letter-spacing:.05em; margin:9px 0 5px 2px}
  .entry{border:1px solid var(--line); border-radius:10px; padding:8px 11px; margin-bottom:0;
    background:#fff; cursor:pointer; display:block; width:100%; text-align:left; min-height:44px}
  .entry-wrap{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px; align-items:stretch;
    margin-bottom:4px; position:relative}
  .entry-wrap .entry{padding-right:11px; min-width:0}
  .entry-wrap .entry-x{position:static; z-index:1; width:44px; min-width:44px; height:44px; align-self:center;
    border-radius:10px; background:#fff; box-shadow:0 1px 4px rgba(26,40,34,.08); flex:0 0 auto}
  .entry.cancelled{opacity:.45; text-decoration:line-through}
  .entry .top{display:flex; gap:8px; align-items:flex-start}
  .entry .emoji{font-size:16px; line-height:1.15; flex:0 0 auto}
  .entry .act{font-size:14px; font-weight:650}
  .entry .meta{font-size:12px; color:#3a5a64; margin-top:2px}
  .entry .kids{display:flex; flex-wrap:wrap; gap:4px; margin-top:4px}
  .avatar{width:30px; height:30px; border-radius:10px; display:grid; place-items:center;
    font-size:11px; font-weight:700; color:#1a2822; flex:0 0 auto}
  .empty{text-align:center; color:var(--muted); padding:20px 14px; font-size:13px;
    border:1px dashed var(--line); border-radius:14px; background:rgba(255,255,255,.45)}
  .empty-state{display:grid; place-items:center; gap:4px; text-align:center;
    padding:24px 18px; border-radius:20px; border:1px dashed var(--line);
    background:linear-gradient(165deg, rgba(255,255,255,.72), rgba(236,254,255,.4));
    box-shadow:0 8px 24px rgba(26,40,34,.04)}
  .empty-state .empty-ico{font-size:26px; line-height:1; opacity:.9}
  .empty-state .empty-title{font-family:var(--font-display); font-size:16px; font-weight:700;
    letter-spacing:-.02em; color:var(--ink); margin:0; max-width:28ch}
  .empty-state .empty-hint{margin:0; font-size:13px; color:var(--muted); max-width:32ch; line-height:1.4}
  .empty-state .btn{width:auto; min-width:140px; margin-top:8px}

  /* Πίνακας ψυγείου — πλακίδια που τα πατάς ή τα σέρνεις */
  .tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:8px; margin-bottom:12px}
  .tile{position:relative; background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:12px 6px 9px; text-align:center; cursor:grab; touch-action:none; user-select:none;
    display:flex; flex-direction:column; gap:2px; align-items:center; justify-content:center;
    min-height:62px; transition:transform .1s}
  .tile:active{transform:scale(.95)}
  /* Μεγάλες γερμανικές λέξεις πρέπει να χωρέσουν, όχι να ξεχειλίσουν */
  .tile .nm{font-size:12px; font-weight:600; line-height:1.18; max-width:100%;
    overflow-wrap:anywhere; hyphens:auto}
  .tile .st{font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
  /* Darkened for contrast: --warn (var(--warn)) hit 3.19:1 and #6b8a94 hit 2.46:1
     against the tile, both under the 4.5:1 minimum for text this size. */
  .tile .st.low{color:#a35304; font-weight:700}
  .tile .st.zero{color:#4a6a74}          /* το μηδέν δεν είναι συναγερμός, είναι απλώς άδειο */
  .tile.empty{background:#fafafa}
  .tile.picked{border-color:var(--brand); box-shadow:0 0 0 2px rgba(47,90,99,.18)}
  .tile .badge{position:absolute; top:-7px; right:-7px; min-width:23px; height:23px; padding:0 6px;
    border-radius:999px; background:var(--brand); color:#fff; font-size:12px; font-weight:700;
    display:grid; place-items:center}
  .tile.out .badge{background:var(--out)} .tile.in .badge{background:var(--in)}
  .drops{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px}
  .dropzone{border:2px dashed var(--line); border-radius:14px; padding:16px 8px; text-align:center;
    color:var(--muted); font-size:13px; font-weight:600; transition:all .15s}
  .dropzone.zin.over{border-color:var(--in);  background:var(--pine-tint); color:var(--in)}
  .dropzone.zout.over{border-color:var(--out); background:var(--out-tint); color:var(--out)}
  .dropzone.zin.filled{border-style:solid; border-color:var(--in); color:var(--in)}
  .dropzone.zout.filled{border-style:solid; border-color:#fca5a5; color:var(--out)}
  /* Stock move board: scrollable catalogue + IN/OUT dock pinned to sheet bottom */
  #sheet:has(.stock-board){display:flex;flex-direction:column;padding:12px 0 0;overflow:hidden;
    height:min(94dvh,100%);max-height:min(94dvh,100%)}
  #sheet:has(.stock-board)>.sheet-close{right:12px;top:10px;float:none;position:absolute;z-index:6;
    width:42px;height:42px}
  #sheet:has(.stock-board)>.grabber{margin:0 auto 6px;flex:0 0 auto}
  #sheet:has(.stock-board) .stock-board{padding-top:36px}
  .stock-board{display:flex;flex-direction:column;min-height:0;flex:1 1 auto;padding:0 16px;overflow:hidden}
  .stock-board-scroll{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    padding-bottom:10px}
  .stock-drops-dock{flex:0 0 auto;margin:0 -16px 0;padding:8px 16px calc(12px + var(--safe-b));
    border-top:1px solid var(--line);background:rgba(255,255,255,.97);backdrop-filter:blur(12px);
    box-shadow:0 -10px 28px rgba(26,40,34,.1);position:relative;z-index:5}
  .stock-drops-dock .drops{margin:0;gap:8px}
  .stock-drops-dock .dropzone{padding:12px 8px;font-size:14px;font-weight:800;min-height:52px;display:grid;place-items:center}
  .stock-drops-dock .stock-board-save{margin:0 0 10px;min-height:48px;width:100%}
  .stock-drops-dock .stock-board-save:disabled{opacity:.55;cursor:not-allowed}
  #sbReasonWrap.flash-need{outline:2px solid var(--out);outline-offset:4px;border-radius:10px;background:var(--out-tint)}
  .stock-toolbar{display:grid;gap:8px;margin:0 0 10px}
  .stock-toolbar-actions{display:flex;gap:8px;flex-wrap:wrap;width:100%;margin-top:8px}
  .stock-toolbar-actions .page-act{flex:1;min-width:120px;justify-content:center;display:inline-flex;align-items:center}
  .store-choice{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px;align-items:center;padding:4px 8px;
    border-bottom:1px solid #eef2ef;min-height:40px}
  .store-choice-name{font-size:13px;font-weight:750;line-height:1.2}
  .store-choice-qty{font-size:11px;color:#4a6a74}
  .store-choice-actions{display:flex;gap:4px}
  .store-decision{width:36px;height:36px;border-radius:10px;font-size:14px}
  .store-cat-h{padding:4px 10px;font-size:11px}
  .store-scroll{padding:4px 8px calc(14px + var(--dock-h,72px))}
  .cart-qty-input{width:64px;height:38px;padding:4px 5px;border:1.5px solid #b8cdd2;border-radius:10px;background:#fff;text-align:center;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}.cart-qty-input:focus{border-color:#2f5a63;background:#eef5f0;box-shadow:0 0 0 3px rgba(47,90,99,.1)}
  .stock-quickbar{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap}
  .stock-quickbar .btn{width:auto;flex:1;min-width:140px;margin:0;min-height:42px}
  .stock-hold-menu{position:fixed;z-index:95;min-width:min(260px,88vw);padding:8px;border-radius:14px;
    background:#fff;border:1px solid var(--line);box-shadow:0 18px 40px rgba(26,40,34,.22)}
  .stock-hold-menu button{display:flex;width:100%;align-items:center;gap:8px;text-align:left;border:0;
    background:transparent;padding:12px 12px;border-radius:10px;font-size:14px;font-weight:650;cursor:pointer}
  .stock-hold-menu button:active{background:#eef2ef}
  .stock-hold-menu .hold-in{color:var(--in)}.stock-hold-menu .hold-out{color:var(--out)}
  .stock-hold-kicker{padding:4px 12px 8px;font-size:11px;color:#4a6a74;font-weight:700}
  .dirbtn{border:1px solid var(--line); background:#fff; border-radius:10px; width:40px; height:40px;
    font-size:16px; font-weight:700; cursor:pointer; flex:0 0 auto; line-height:1}
  .dirbtn.in{background:var(--pine-tint); border-color:var(--in); color:var(--in)}
  .dirbtn.out{background:var(--out-tint); border-color:#fca5a5; color:var(--out)}
  /* Drag-and-drop cursor ghost. Named `.drag-ghost`, NOT `.ghost`: the plain
     name collided with the `.btn.ghost` button style, which made those buttons
     position:fixed + pointer-events:none (off-screen, unclickable) and let
     clearGhosts() delete them from the DOM. */
  .drag-ghost{position:fixed; z-index:90; pointer-events:none; opacity:.9; transform:translate(-50%,-50%) scale(1.05);
    background:#1a2822; color:#fff; padding:8px 12px; border-radius:10px; font-size:13px; font-weight:600}
  .basket-row{display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:8px;
    padding:12px 0; border-bottom:1px solid var(--line)}
  .basket-row:last-child{border-bottom:0}
  .basket-row .grow{min-width:0; overflow-wrap:anywhere}
  .quantity-controls{grid-column:1/-1;display:grid;grid-template-columns:44px 48px minmax(70px,1fr) 48px 44px;
    align-items:center;gap:4px;padding-top:2px}
  .step{width:48px; height:48px; border-radius:10px; border:1px solid var(--line); background:#f2f4f1;
    font-size:21px; font-weight:800; cursor:pointer; line-height:1}
  .step:active{background:#d5e4e8}
  .qty-jump{width:44px;height:40px;padding:0 5px;border:1px solid #c5ddd0;border-radius:999px;
    background:#eef5f0;color:#2a6b52;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap}
  .qty-jump:active{background:#dceee4;transform:scale(.97)}
  .qty-input-wrap{position:relative;min-width:0}.qty-input-wrap span{position:absolute;right:10px;top:50%;
    transform:translateY(-50%);color:#4a6a74;font-size:11px;font-weight:750;pointer-events:none}
  .qty-field{width:100%;height:48px;padding:8px 38px 8px 10px;text-align:center;font-weight:800;
    font-size:16px;border:2px solid #c5ddd0;border-radius:10px;background:#fff;font-variant-numeric:tabular-nums}
  .qty-field:focus{border-color:#2f5a63;background:#eef5f0;box-shadow:0 0 0 3px rgba(47,90,99,.12)}

  /* Store mode — μεγάλα κουμπιά για χρήση μέσα στο σουπερμάρκετ */
  .store-row{display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:#fff; border:1px solid var(--line); border-radius:10px;
    padding:12px 13px; margin-bottom:4px; cursor:pointer; font-size:14px}
  .store-row .tick{width:28px; height:28px; border-radius:6px; border:2px solid var(--line);
    display:grid; place-items:center; font-size:14px; font-weight:700; flex:0 0 auto; color:transparent}
  .store-row.bought{background:var(--pine-tint); border-color:var(--in)}
  .store-row.bought .tick{background:var(--in); border-color:var(--in); color:#fff}
  .store-row.bought .strong{text-decoration:line-through; opacity:.65}
  .store-row.missing{background:var(--out-tint); border-color:#fca5a5}
  .store-row.missing .tick{background:var(--out); border-color:var(--out); color:#fff}

  /* Εβδομαδιαία προβολή — οριζόντια κύλιση, σαν το χαρτί */
  .grid-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:#fff;
    -webkit-overflow-scrolling:touch}
  table.wk{border-collapse:collapse; width:max-content; min-width:100%; font-size:11px}
  table.wk th, table.wk td{border:1px solid var(--line); padding:4px 6px; vertical-align:top}
  table.wk th{background:#f2f4f1; font-size:11px; text-transform:uppercase; letter-spacing:.04em;
    color:var(--muted); font-weight:700; position:sticky; top:0}
  table.wk td.lbl, table.wk th.lbl{position:sticky; left:0; background:#f2f4f1; font-weight:700;
    z-index:1; min-width:74px; font-size:11px}
  table.wk td{min-width:104px; cursor:pointer}
  table.wk td:hover{background:#f2f4f1}
  .cellitem{position:relative; margin-bottom:4px; line-height:1.3; padding:4px 26px 5px 6px;
    border-radius:6px; background:#f2f4f1; border:1px solid transparent; cursor:pointer}
  .cellitem:hover,.cellitem:focus-visible{border-color:#b8cdd2; background:#fff; outline:none}
  .cellitem b{font-weight:650}
  .cellitem .c{color:#075985}
  .cellitem-time{display:inline-block;margin-top:2px;padding:2px 6px;border-radius:999px;
    background:#e8f0eb;color:#075985;font-size:11px;font-weight:750;font-variant-numeric:tabular-nums;
    line-height:1.35;max-width:100%}
  .cellitem-sub{margin-top:2px;color:#4a6a74;font-size:11px}
  .cellitem,.cellitem *{overflow-wrap:anywhere}
  .cellitem-x{position:absolute; top:2px; right:2px; width:22px; height:22px; border:0;
    border-radius:6px; background:transparent; color:#6b8a94; font-size:14px; line-height:1;
    cursor:pointer; padding:0; display:grid; place-items:center}
  .cellitem-x:hover,.cellitem-x:focus-visible{background:var(--out-tint); color:var(--out); outline:none}

  .planner-filters{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;
    margin-bottom:12px;box-shadow:0 5px 18px rgba(26,40,34,.04)}
  .filter-label{display:block;font-size:11px;font-weight:750;text-transform:uppercase;
    letter-spacing:.05em;color:var(--muted);margin:0 0 5px 2px}
  .planner-filters .seg:last-child{margin-bottom:0}

  /* ═══ Plan day overhaul — Aegean ops ═══════════════════════════════ */
  .planner{
    --plan-deep:#1a2822; --plan-sea:#2f5a63; --plan-sun:#c48a1a; --plan-sand:#eef4f5;
    --plan-ink:#1a2822; --plan-meta:#3a5a64; --plan-line:rgba(26,40,34,.14);
    --plan-morn:#2a6b52; --plan-aft:#c48a1a; --plan-eve:#2a4a40;
    font-family:var(--font-ui); color:var(--plan-ink);
    margin:0 -4px; padding:0 4px calc(var(--fab-size) + 28px);
    background:
      radial-gradient(ellipse 80% 40% at 100% 0%, rgba(196,138,26,.12), transparent 50%),
      radial-gradient(ellipse 60% 35% at 0% 20%, rgba(47,90,99,.1), transparent 45%),
      linear-gradient(180deg, var(--plan-sand) 0%, #e4eef0 100%);
    border-radius:20px;
  }
  .planner-chrome{
    position:sticky; top:calc(var(--header-h,58px) - 2px); z-index:12;
    display:grid; gap:8px; margin:0 0 12px; padding:8px 8px;
    background:rgba(238,244,245,.94); border:1px solid var(--plan-line); border-radius:14px;
    box-shadow:0 10px 28px rgba(26,40,34,.08); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  }
  .planner-seg{margin:0; background:#e8eef1; border:1px solid var(--plan-line); border-radius:14px;
    padding:4px; gap:4px; overflow-x:auto; scroll-snap-type:x proximity;
    mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 12px),transparent 100%);
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 12px),transparent 100%)}
  .planner-seg button{
    flex:1 0 auto; min-width:64px; max-width:140px; min-height:44px; padding:4px 10px;
    display:inline-flex; align-items:center; justify-content:center; gap:4px;
    border-radius:10px; color:#2d4a52; font-weight:700; font-size:12px; scroll-snap-align:start;
  }
  .planner-seg button .planner-seg-ico{flex:0 0 auto; font-size:13px; line-height:1}
  .planner-seg button .planner-seg-lbl{min-width:0; overflow:hidden; text-overflow:ellipsis}
  .planner-seg button .lbl-short{display:none}
  .planner-seg button.on{background:var(--plan-deep); color:#fff; box-shadow:0 8px 18px rgba(26,40,34,.28)}
  .planner-seg-house button.on{background:var(--plan-sun); color:#0a2e36; box-shadow:0 8px 18px rgba(196,138,26,.28)}
  @media (max-width:400px){
    .planner-seg button .lbl-full{display:none}
    .planner-seg button .lbl-short{display:inline}
    .planner-seg button{min-width:52px; max-width:110px; padding:4px 8px}
  }
  .plan-hero{
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap;
    margin:0 0 14px; padding:16px 16px 18px; border-radius:20px; color:#eef5f0;
    background:
      radial-gradient(circle at 92% 8%, rgba(196,138,26,.32), transparent 36%),
      linear-gradient(145deg, #0b3d4a 0%, #2f5a63 52%, #3d8a6a 100%);
    box-shadow:0 16px 36px rgba(26,40,34,.22);
  }
  .plan-hero-copy{min-width:0; flex:1 1 180px}
  .plan-hero .brand-kicker{
    font-family:var(--font-display); font-size:11px; font-weight:800;
    letter-spacing:.2em; text-transform:uppercase; color:var(--plan-sun); margin-bottom:4px;
  }
  .plan-hero-date{font-family:var(--font-display); font-size:clamp(20px,5.2vw,26px); font-weight:750;
    letter-spacing:-.03em; margin:0 0 6px; line-height:1.15; color:#fff}
  .plan-hero-meet{margin:0; font-size:13px; color:#c5d5cc; max-width:36ch}
  .plan-hero-cta{flex:0 0 auto; margin:0; align-self:center; box-shadow:0 10px 24px rgba(0,0,0,.18)!important}
  .plan-hero-actions{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:flex-end}
  /* Light heroes: ink on white — frosted white-on-white looked empty after v145. */
  .plan-hero-actions .btn.sm{width:44px; min-width:44px; padding:0; background:#fff; color:var(--ink); border:1px solid var(--line)}
  .plan-hero-actions .btn.sm[data-page-act]{width:auto; min-width:0; padding:0 10px; font-size:11px; font-weight:650; white-space:nowrap}
  .plan-days,.planner .days{
    display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x mandatory; padding:2px 2px 12px;
    margin:0 0 8px; scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .plan-days::-webkit-scrollbar,.planner .days::-webkit-scrollbar{display:none}
  .plan-day-chip.day,.planner .day{
    flex:0 0 auto; width:58px; min-height:62px; padding:8px 0; border-radius:14px;
    border:1.5px solid var(--plan-line); background:rgba(255,255,255,.92); color:var(--plan-ink);
    cursor:pointer; scroll-snap-align:center; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:2px; box-shadow:0 4px 12px rgba(26,40,34,.06);
    transition:transform var(--m-base, .28s) var(--ease-settle, cubic-bezier(.2,.8,.2,1)),
      background var(--m-fast, .18s) var(--ease-settle, cubic-bezier(.2,.8,.2,1)),
      border-color var(--m-fast, .18s) var(--ease-settle, cubic-bezier(.2,.8,.2,1)),
      box-shadow var(--m-fast, .18s) var(--ease-settle, cubic-bezier(.2,.8,.2,1));
  }
  .plan-day-chip.day .d,.planner .day .d{font-size:11px; color:var(--plan-meta); font-weight:700}
  .plan-day-chip.day .n,.planner .day .n{font-size:16px; font-weight:750; font-variant-numeric:tabular-nums; line-height:1.1}
  .plan-day-chip.day .n i,.planner .day .n i{font-style:normal; font-size:11px; font-weight:700; opacity:.72}
  .plan-day-chip.day.today,.planner .day.today{box-shadow:0 0 0 2px var(--plan-sun), 0 6px 14px rgba(196,138,26,.2)}
  .plan-day-chip.day.today .n,.planner .day.today .n{color:var(--plan-sun)}
  .plan-day-chip.day.on,.planner .day.on{
    background:var(--pine-wash, color-mix(in srgb, var(--brand) 16%, #fff));
    border-color:var(--brand); color:var(--ink);
    transform:translateY(-1px); box-shadow:0 6px 14px rgba(26,40,34,.10);
  }
  .plan-day-chip.day.on .d,.planner .day.on .d{color:var(--sea)}
  .plan-day-chip.day.on .n,.planner .day.on .n{color:var(--ink)}
  .plan-day-chip.day.on.today .n,.planner .day.on.today .n{color:var(--ink)}
  .plan-block{
    margin:0 0 14px; padding:12px 12px 10px; border-radius:14px; background:rgba(255,255,255,.88);
    border:1px solid var(--plan-line); border-left:4px solid var(--plan-morn);
    box-shadow:0 8px 22px rgba(26,40,34,.06);
    animation:planDayIn .42s ease both; animation-delay:calc(var(--block-i,0) * 70ms);
  }
  .plan-block.block-afternoon,.plan-block-h.block-afternoon{border-left-color:var(--plan-aft)}
  .plan-block.block-evening,.plan-block-h.block-evening{border-left-color:var(--plan-eve)}
  .plan-block.block-morning{border-left-color:var(--plan-morn)}
  .plan-block-h,.planner .block-h{
    display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; padding:0 2px;
  }
  .plan-block-h .t,.planner .block-h .t{font-family:var(--font-display); font-size:14px; font-weight:750; color:var(--plan-ink)}
  .plan-time-chip,.planner .block-h .hrs{
    display:inline-flex; align-items:center; padding:4px 10px; border-radius:999px;
    background:#e8f0eb; color:#2f5a63; font-size:11px; font-weight:750; font-variant-numeric:tabular-nums;
  }
  .plan-block.block-afternoon .plan-time-chip,.planner .block-h.block-afternoon .hrs{background:var(--amber-tint); color:var(--warn)}
  .plan-block.block-evening .plan-time-chip,.planner .block-h.block-evening .hrs{background:#d5e4e8; color:#1e3a5f}
  .plan-lane{margin:0 0 8px}
  .plan-lane-h,.planner .house-h{
    font-size:11px; font-weight:800; color:var(--plan-meta); text-transform:uppercase;
    letter-spacing:.06em; margin:10px 0 6px 2px;
  }
  .plan-lane-empty.empty,.planner .plan-lane-empty,
  .plan-lane-empty.empty-state-btn{
    width:100%; cursor:pointer; background:rgba(255,255,255,.55); border:1.5px dashed var(--plan-line);
    border-radius:14px; color:var(--plan-meta); padding:12px 12px; font-size:13px; font-weight:650;
    min-height:64px; touch-action:manipulation; display:grid; place-items:center; gap:4px; text-align:center;
  }
  .plan-lane-empty.empty-state-btn .empty-ico{font-size:18px; line-height:1; color:var(--brand)}
  .plan-lane-empty.empty-state-btn .empty-title{font-size:13px; font-weight:750; color:var(--plan-ink)}
  .plan-lane-empty.empty:active,.planner .plan-lane-empty:active,
  .plan-lane-empty.empty-state-btn:active{transform:scale(.99); background:rgba(238,245,240,.85)}
  .plan-block-add{text-align:right; margin-top:4px}
  .plan-block-add .btn.ghost{width:auto; color:var(--plan-sea); min-height:40px}
  .plan-entry{
    --entry-accent:var(--plan-sea);
    display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px; align-items:stretch;
    margin-bottom:8px; animation:planEntryIn .35s ease both;
  }
  .plan-entry-main.entry{
    border:1px solid var(--plan-line); border-left:4px solid var(--entry-accent);
    border-radius:14px; background:#fff; box-shadow:0 6px 16px rgba(26,40,34,.05);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .plan-entry-main.entry:active{transform:scale(.985)}
  .plan-entry .act{font-family:var(--font-display); font-weight:700; color:var(--plan-ink)}
  .plan-entry .meta{color:var(--plan-meta)}
  .plan-entry-flags{flex:0 0 auto}
  .plan-entry-x{width:44px; min-width:44px; height:44px; border-radius:10px; align-self:center;
    background:#fff; border:1px solid var(--plan-line); color:#4a6a74}
  .planner .matrix-shell{margin-bottom:12px}
  .planner .matrix{border-radius:14px; border-color:var(--plan-line); background:rgba(255,255,255,.95)}
  .planner .matrix-head{
    background:linear-gradient(180deg,#e8f4f5,#eef6f7); color:var(--plan-deep);
    font-family:var(--font-display); font-weight:750; letter-spacing:.03em;
  }
  .planner .matrix-row:first-child .matrix-label{background:#e8f4f5; color:var(--plan-deep)}
  .planner .matrix-toolbar-title{font-family:var(--font-display); color:var(--plan-deep); text-transform:none; letter-spacing:-.01em; font-size:14px}
  .planner .card{background:rgba(255,255,255,.92); border-color:var(--plan-line); color:var(--plan-ink)}
  .planner .muted{color:var(--plan-meta)}
  .mh-day{display:block; font-size:11px; font-weight:750; letter-spacing:.06em; text-transform:uppercase; color:var(--plan-meta); line-height:1.2}
  .mh-date{display:block; margin-top:2px; font-family:var(--font-display); font-size:13px; font-weight:750;
    letter-spacing:-.02em; text-transform:none; color:var(--plan-ink); line-height:1.15}
  .matrix-head .mh-day{color:var(--plan-deep); opacity:.72}
  .matrix-head .mh-date{color:var(--plan-deep)}
  .matrix-label .mh-day{color:var(--plan-meta)}
  .matrix-label .mh-date{color:var(--plan-ink)}
  .matrix-row:first-child .mh-date{color:var(--plan-deep)}

  /* Week / shift roster — real timetable (desktop matrix + mobile stacked table) */
  .week-jump{
    display:flex; gap:6px; overflow-x:auto; scroll-snap-type:x proximity;
    margin:0 0 12px; padding:0 2px 8px; scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .week-jump::-webkit-scrollbar{display:none}
  .week-jump-day{
    flex:0 0 auto; min-width:58px; min-height:58px; padding:8px 10px; border-radius:10px;
    border:1px solid var(--plan-line); background:rgba(255,255,255,.92); color:var(--plan-ink);
    display:grid; gap:2px; justify-items:center; scroll-snap-align:start; cursor:pointer;
    font:inherit; touch-action:manipulation;
  }
  .week-jump-day .wj-name{font-size:10px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--plan-meta)}
  .week-jump-day .wj-date{font-family:var(--font-display); font-size:13px; font-weight:750; font-variant-numeric:tabular-nums}
  .week-jump-day .wj-count{font-size:10px; font-weight:750; color:var(--plan-sea)}
  .week-jump-day.is-today{box-shadow:inset 0 0 0 1.5px var(--plan-sun)}
  .week-jump-day.is-selected{background:linear-gradient(160deg,var(--plan-deep),var(--plan-sea)); border-color:transparent; color:#fff}
  .week-jump-day.is-selected .wj-name,.week-jump-day.is-selected .wj-count{color:#c5d5cc}

  /* Week switcher + AI bar + mobile day-focus */
  .week-switcher{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
  .week-switcher .btn.sm{width:44px;min-width:44px;padding:0}
  .week-switcher .week-today-btn{width:auto!important;min-width:0;padding:0 10px;font-size:11px;font-weight:700}
  .week-switcher .week-today-btn.on{opacity:.55}
  .week-pick-label{display:inline-flex;margin:0}
  .week-pick{height:44px;min-width:118px;padding:0 8px;border:1px solid var(--plan-line);border-radius:10px;
    background:#fff;color:var(--plan-ink);font:650 12px/1 var(--font-ui)}
  .week-ai-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%;margin:4px 0 0}
  .week-ai-bar .week-ai-fill{flex:1 1 160px;min-height:48px;margin:0;font-weight:750}
  .week-ai-bar .week-ai-clear{min-height:48px;margin:0}
  .week-rotate-coach{
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    margin:0 0 12px;padding:12px 14px;border-radius:12px;border:1px solid rgba(196,138,26,.35);
    background:linear-gradient(135deg,#fff8eb,#f7f3ea);
  }
  .week-rotate-copy{display:grid;gap:2px;min-width:0}
  .week-rotate-copy b{font-size:13px;font-weight:800;color:var(--plan-ink)}
  .week-rotate-copy span{font-size:12px;color:var(--plan-meta);line-height:1.35}
  .week-day-focus{display:none;gap:10px;margin:0 0 14px}
  .week-day-focus-nav{display:flex;align-items:center;gap:8px}
  .week-day-focus-title{flex:1;text-align:center;font-family:var(--font-display);font-size:15px;font-weight:750}
  .week-swipe-hint{margin:0;font-size:11px;text-align:center}
  .week-mobile-mode-row,.week-mobile-matrix-bar{display:none}
  .stock-shift-check-cta{min-height:44px;white-space:nowrap}
  .shift-check-open-btn{min-height:48px;min-width:132px;touch-action:manipulation;font-weight:800}


  .week-roster{display:grid; gap:16px; margin:0 0 14px}
  .week-roster-block{min-width:0}
  .week-roster-h{margin:0 0 6px; padding:0 2px}
  .week-roster .matrix-shell{margin-bottom:0}
  .week-roster .matrix-toolbar,
  .shift-roster .matrix-toolbar{
    min-height:40px; margin:0; padding:6px 10px; gap:8px;
    border:1px solid var(--plan-line); border-bottom:0; border-radius:10px 10px 0 0;
    background:linear-gradient(180deg,#e8f0eb,#f2f4f1);
  }
  .week-roster .matrix,
  .shift-roster .matrix{
    border-radius:0 0 10px 10px; max-height:min(68vh,720px);
  }
  .matrix-toolbar-hint{font-size:10px; font-weight:650; color:var(--plan-meta); white-space:nowrap}
  .roster-footnote{margin:0 0 12px; font-size:12px}
  .roster-unassigned{font-style:italic; color:var(--plan-meta); font-weight:650}
  .roster-matrix .matrix-cell{min-height:56px; padding:6px 7px}
  .roster-matrix .matrix-head{min-height:42px; padding-top:8px; padding-bottom:8px}
  .roster-matrix .matrix-add{opacity:.55}
  .roster-matrix .matrix-action:hover .matrix-add,
  .roster-matrix .matrix-action:focus-visible .matrix-add{opacity:1}
  .roster-matrix .matrix-action.has-items{background:rgba(238,245,240,.35)}

  /* Easy / Pro density hooks (sibling owns global mode toggle) */
  body.mode-easy .roster-matrix .matrix-cell,
  body.mode-easy[data-density] .matrix-cell{min-height:72px; padding:10px}
  body.mode-easy .roster-matrix .matrix-add{opacity:1; font-size:18px}
  body.mode-easy .matrix-toolbar-hint{display:none}
  body.mode-pro .roster-matrix .matrix-cell{min-height:44px; padding:4px 5px}
  body.mode-pro .roster-matrix .cellitem{padding:2px 22px 3px 4px; font-size:11px}
  body.mode-pro .roster-matrix .cellitem-sub{display:none}
  body.mode-pro .week-jump-day{min-width:48px; min-height:48px; padding:6px}
  [data-density="compact"] .roster-matrix .matrix-cell{min-height:44px; padding:4px 5px}
  [data-density="comfortable"] .roster-matrix .matrix-cell{min-height:72px; padding:10px}

  /* Mobile stacked roster table (still tabular rows) */
  .week-day-stack{display:none; gap:10px; margin:0 0 14px}
  .week-matrix-desktop{display:block}
  .week-day-card.week-day-table{
    border:1px solid var(--plan-line); border-radius:12px; overflow:hidden;
    background:rgba(255,255,255,.94); box-shadow:0 6px 18px rgba(26,40,34,.05);
  }
  .week-day-card.is-today{box-shadow:0 0 0 1.5px rgba(196,138,26,.4), 0 6px 18px rgba(26,40,34,.06)}
  .week-day-card.is-selected{border-color:rgba(42,107,82,.4)}
  .week-day-card-h{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:10px 12px; border:0; border-bottom:1px solid var(--plan-line);
    background:linear-gradient(180deg,#eef4f0,#f5f7f5); color:var(--plan-ink);
    text-align:left; font:inherit;
  }
  .week-day-card.is-today .week-day-card-h{background:linear-gradient(135deg,#1a2822,#2a6b52); color:#fff; border-bottom-color:transparent}
  .wd-main{display:grid; gap:2px; min-width:0}
  .wd-name{font-family:var(--font-display); font-size:15px; font-weight:750; letter-spacing:-.02em}
  .wd-date{font-size:11px; font-weight:650; color:var(--plan-meta); font-variant-numeric:tabular-nums}
  .week-day-card.is-today .wd-date{color:#c5d5cc}
  .wd-meta{display:inline-flex; align-items:center; gap:8px; flex:0 0 auto; font-size:12px; font-weight:800}
  .wd-meta b{
    display:grid; place-items:center; width:26px; height:26px; border-radius:8px;
    background:rgba(42,107,82,.12); font-size:11px;
  }
  .week-day-card.is-today .wd-meta b{background:rgba(255,255,255,.14); color:#fff}
  .week-day-card-body{padding:8px; display:grid; gap:8px}
  .week-stack-block{
    padding:0; border-radius:8px; background:#fff; border:1px solid var(--plan-line);
    border-left:3px solid var(--plan-morn); overflow:hidden;
  }
  .week-stack-block.block-afternoon{border-left-color:var(--plan-aft)}
  .week-stack-block.block-evening{border-left-color:var(--plan-eve)}
  .week-stack-block-h{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:8px 10px; border-bottom:1px solid var(--plan-line); background:#f5f7f5;
  }
  .week-stack-block-h span:first-child{font-family:var(--font-display); font-size:12px; font-weight:750; color:var(--plan-ink)}
  .week-stack-table{display:grid; width:100%}
  .week-stack-tr{
    display:grid; grid-template-columns:76px minmax(0,1fr) 40px; gap:0;
    border-bottom:1px solid var(--plan-line); align-items:stretch; min-height:44px;
  }
  .week-stack-tr:last-child{border-bottom:0}
  .week-stack-thead{
    min-height:32px; background:#eef4f0; font-size:9px; font-weight:800;
    letter-spacing:.06em; text-transform:uppercase; color:var(--plan-meta);
  }
  .week-stack-thead span{display:flex; align-items:center; padding:6px 8px}
  .week-stack-rh{
    display:flex; align-items:center; padding:8px; font-size:11px; font-weight:750;
    color:var(--plan-ink); border-right:1px solid var(--plan-line); background:#fafbfa;
  }
  .week-stack-cell{padding:6px 8px; min-width:0}
  .week-stack-add,.week-stack-add-h{
    display:grid; place-items:center; border:0; border-left:1px solid var(--plan-line);
    background:#f2f4f1; color:var(--brand); font-size:16px; font-weight:800; cursor:pointer;
    touch-action:manipulation; min-height:44px;
  }
  .week-stack-add:active{background:#d5e4e8}
  .week-open-day{
    min-height:32px; padding:0 10px; border:0; border-radius:8px;
    background:var(--brand); color:#fff; font:700 11px/1 var(--font-ui); cursor:pointer;
  }
  .week-day-card.is-today .week-open-day{background:rgba(255,255,255,.18); color:#fff}

  body.layout-mobile .week-day-stack{display:none}
  body.layout-mobile .week-day-focus{display:grid}
  body.layout-mobile .week-matrix-desktop{display:none}
  body.layout-mobile .week-mobile-mode-row{display:flex;justify-content:center;margin-top:4px}
  body.layout-mobile.week-mobile-full .week-day-focus{display:none}
  body.layout-mobile.week-mobile-full .week-matrix-desktop{display:grid;gap:12px}
  body.layout-mobile.week-mobile-full .week-mobile-matrix-bar{display:flex;justify-content:flex-end;margin:0 0 8px}
  body.layout-desktop .week-day-stack,
  body.layout-desktop .week-day-focus{display:none}
  body.layout-desktop .week-matrix-desktop{display:block}
  body.layout-desktop .week-rotate-coach,
  body.layout-desktop .week-mobile-mode-row,
  body.layout-desktop .week-mobile-matrix-bar{display:none!important}
  body.layout-mobile .plan-shift .matrix,
  body.layout-mobile .shift-roster .matrix{max-height:min(70vh,640px)}
  body.layout-mobile .matrix-add{opacity:1}
  body.layout-mobile .matrix-head{padding-top:10px;padding-bottom:10px}
  body.layout-mobile .matrix-toolbar-hint{display:none}
  @media (orientation:landscape) and (max-height:520px){
    body.layout-mobile:not(.week-mobile-dayforce) .week-day-focus{display:none}
    body.layout-mobile:not(.week-mobile-dayforce) .week-matrix-desktop{display:grid;gap:10px}
    body.layout-mobile:not(.week-mobile-dayforce) .week-rotate-coach{display:none}
    body.layout-mobile:not(.week-mobile-dayforce) .week-mobile-matrix-bar{display:flex;justify-content:flex-end;margin:0 0 8px}
  }
  body.layout-mobile.week-mobile-dayforce .week-day-focus{display:grid!important}
  body.layout-mobile.week-mobile-dayforce .week-matrix-desktop{display:none!important}
  body.layout-mobile.week-mobile-dayforce .week-mobile-mode-row,
  body.layout-mobile.week-mobile-dayforce .week-mobile-matrix-bar{display:none!important}
  @media (max-width:720px){
    .shift-check-row{grid-template-columns:minmax(0,1fr) 84px 56px;gap:6px;padding:10px;min-height:56px}
    .shift-check-ok{min-height:48px;height:48px;min-width:56px;touch-action:manipulation}
    .shift-check-qty input{min-height:48px;height:48px}
    .shift-check-actions{padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:2}
    .shift-check-banner{gap:10px}
    .shift-check-open-btn{width:100%;min-height:48px}
  }

  @keyframes planDayIn{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
  @keyframes planEntryIn{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){
    .plan-block,.plan-entry,.plan-day-chip.day.on,.planner .day.on{animation:none!important; transition:none!important; transform:none!important}
  }

  /* Νέο table system: ένα ενιαίο, responsive matrix αντί για τα παλιά πυκνά tables. */
  .matrix-shell{margin-bottom:12px}
  .matrix-toolbar{display:flex;align-items:center;gap:8px;margin:0 0 7px;flex-wrap:wrap}
  .matrix-toolbar-title{flex:1;min-width:0;font-size:12px;font-weight:800;color:#2d4a52;
    text-transform:uppercase;letter-spacing:.04em}
  .matrix-fs-btn,.matrix-fs-close{width:auto;margin:0;min-height:36px;padding:4px 11px;border:1px solid var(--line);
    border-radius:10px;background:#f2f4f1;color:#1a2822;font-size:12px;font-weight:750;cursor:pointer;
    touch-action:manipulation}
  .matrix-fs-btn:active,.matrix-fs-close:active{background:#d5e4e8}
  .matrix-fs-close{background:#1a2822;border-color:#1a2822;color:#fff}
  .matrix{--cols:8; overflow:auto; border:1px solid var(--line); border-radius:14px;
    background:#fff; box-shadow:0 8px 24px rgba(26,40,34,.05); margin-bottom:0;
    scrollbar-width:thin; -webkit-overflow-scrolling:touch; max-height:min(70vh,640px)}
  .matrix-row{display:grid; grid-template-columns:140px repeat(var(--cols),minmax(0,1fr));
    width:100%; min-width:var(--matrix-min,100%); border-bottom:1px solid var(--line); align-items:stretch}
  .matrix-row:last-child{border-bottom:0}
  .matrix-cell{min-width:0; padding:8px; border-right:1px solid var(--line); position:relative;
    overflow:visible; overflow-wrap:anywhere}
  .matrix-cell .cellitem{overflow:visible}
  .matrix-cell:last-child{border-right:0}
  .matrix-head{position:sticky; top:0; z-index:3; background:linear-gradient(180deg,#eef5f0,#f2f4f1); color:var(--muted);
    font-size:11px; font-weight:750; text-transform:none; letter-spacing:.02em}
  .matrix-head .mh-day{display:block;font-weight:800;color:var(--ink);text-transform:uppercase;letter-spacing:.04em;font-size:11px}
  .matrix-head .mh-date{display:block;margin-top:2px;font-weight:700;color:var(--sea);font-size:12px;letter-spacing:0}
  .matrix-label{position:sticky; left:0; z-index:2; min-width:0; background:#fff;
    font-weight:700; box-shadow:5px 0 12px rgba(26,40,34,.05)}
  .matrix-row:first-child .matrix-label{z-index:4; background:#f2f4f1}
  .matrix-action{cursor:pointer; min-height:76px; transition:background .15s}
  .matrix-action:hover,.matrix-action:focus-visible{background:#eef5f0; outline:none}
  .matrix-empty{color:var(--muted); font-size:11px; font-weight:650}
  .matrix-add{position:absolute; right:7px; bottom:5px; color:var(--brand); font-size:16px;
    opacity:0; transition:opacity .15s}
  .matrix-action:hover .matrix-add,.matrix-action:focus-visible .matrix-add{opacity:1}
  .matrix-shell.is-fullscreen{position:fixed;inset:0;z-index:70;margin:0;display:flex;flex-direction:column;
    background:linear-gradient(165deg,#e9ece8,#dfe6e1);padding:calc(8px + env(safe-area-inset-top,0px)) 0 calc(8px + env(safe-area-inset-bottom,0px))}
  .matrix-shell.is-fullscreen .matrix-toolbar{flex:0 0 auto;padding:0 12px 8px;margin:0;
    background:rgba(26,40,34,.86);color:#fff;min-height:52px;align-items:center;
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-bottom:1px solid rgba(155,196,176,.2)}
  .matrix-shell.is-fullscreen .matrix-toolbar-title{color:#c5ddd0}
  .matrix-shell.is-fullscreen .matrix{flex:1 1 auto;min-height:0;max-height:none;height:auto;margin:0;
    border:0;border-radius:0;box-shadow:none;background:rgba(255,255,255,.92)}
  body.matrix-fullscreen header,body.matrix-fullscreen .bottom-panel{display:none!important}
  body.matrix-fullscreen #app{max-width:none}

  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .sheet-close{position:sticky; top:6px; z-index:5; float:right; width:44px; height:44px;
    margin:0 0 2px 8px; border:1px solid var(--line); border-radius:50%; background:var(--glass-strong);
    color:var(--ink); font-size:21px; line-height:1; cursor:pointer; display:grid; place-items:center;
    backdrop-filter:blur(10px); box-shadow:0 4px 14px rgba(26,40,34,.08)}
  .sheet-close:hover{background:#eef5f0; color:var(--brand)}
  .mini-x{width:34px; height:34px; border:1px solid var(--line); border-radius:10px; background:#fff;
    color:#4a6a74; cursor:pointer; font-size:18px; flex:0 0 auto}

  .child-tabs{position:sticky; top:calc(var(--header-h, 96px) - 2px); z-index:10;
    background:rgba(233,236,232,.92); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    padding:4px; margin:0 0 10px; border:1px solid var(--line); border-radius:14px}
  .child-tabs button{font-size:12px;padding:8px 10px;min-height:42px}
  .child-profile{text-align:center;padding:4px 0 12px}
  .child-profile-ava{width:64px;height:64px;border-radius:50%;margin:0 auto 8px;font-size:21px;
    box-shadow:0 10px 24px rgba(26,40,34,.12); border:2px solid rgba(155,196,176,.45)}
  .child-profile-name{font-family:var(--font-display);font-size:18px;font-weight:750;letter-spacing:-.02em;color:var(--ink)}
  .games-hero{position:relative;overflow:hidden;margin:0 0 14px;padding:20px 20px;border-radius:20px;color:#eef5f0;
    background:

  /* ══════════════════════════════════════════════════════════════════
     LISTE + LAGER OVERHAUL
     Loaded last so it wins over the earlier mobile media queries.

     Problems this replaces:
       · shop rows stacked to one column under 640px — 102px per row, with
         the controls marooned on their own line above a dead left half
       · Lager: 62 products x 66px = 4970px of scroll (≈13 phone screens)
       · every row repeated its state as both a full background tint and a
         text label ("Gut versorgt"), so the exceptions did not stand out
     Approach: one line per item, a left accent bar carrying state, and
     status text only where action is needed. Touch targets stay >=44px.
     ══════════════════════════════════════════════════════════════════ */

  /* Screen-reader-only: keeps state announced when it is not drawn. */
  .u-sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;
    overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}

  /* ── shared row shell ─────────────────────────────────────────── */
  .shop-item,.stock-product{
    position:relative;
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    align-items:center;
    gap:8px;
    min-height:52px;
    padding:4px 9px 6px 13px;
    border:1px solid #e6ecf3;
    border-radius:10px;
    background:#fff;
  }
  /* State reads from a 3px rail, not a wash of colour, so a shelf of
     healthy stock stays calm and the gaps jump out. */
  .shop-item::before,.stock-product::before{
    content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;
    border-radius:0 6px 6px 0;background:transparent;
  }
  .stock-product.low{background:#fffcf6;border-color:#fde9c8}
  .stock-product.low::before{background:var(--warn)}
  .stock-product.empty{background:#fff7f7;border-color:#f9d3d3}
  .stock-product.empty::before{background:var(--out)}
  .stock-product.drafting{background:#eef5f0;border-color:#9bc4b0}
  .stock-product.drafting::before{background:#2a6b52}

  .shop-item-name,.stock-product-name{
    font-weight:680;font-size:14px;line-height:1.3;letter-spacing:-.01em;
    color:#1a2822;
    display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    -webkit-line-clamp:none;
  }
  .shop-item-sub,.stock-product-meta{
    margin-top:2px;color:#4a6a74;font-size:11px;font-weight:600;line-height:1.25;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  /* "Healthy" needs no label — only exceptions earn ink. */
  .stock-product:not(.low):not(.empty):not(.drafting) .stock-product-meta{
    position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;
    overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;
  }
  .stock-product.low .stock-product-meta{color:#b45309;font-weight:750}
  .stock-product.empty .stock-product-meta{color:var(--out);font-weight:750}

  /* ── Lager stepper ────────────────────────────────────────────── */
  .stock-product-main{
    display:block;min-width:0;padding:0;border:0;background:none;
    text-align:left;font:inherit;color:inherit;cursor:pointer;
  }
  .stock-stepper{display:inline-flex;align-items:center;gap:2px;flex:0 0 auto}
  .stock-step{
    width:44px;height:44px;min-width:44px;border-radius:10px;

    min-width:44px;padding:0 2px;text-align:center;
    font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05;
  }
  .stock-qty small{display:block;margin-top:2px;font-size:11px;font-weight:700;
    color:#6b8a94;letter-spacing:.02em}

  /* ── Liste row controls ───────────────────────────────────────── */
  .cart-controls{display:flex;align-items:center;gap:2px;flex-wrap:nowrap;justify-content:flex-end}
  .cart-step{width:44px;min-width:44px;height:44px;padding:0;border-radius:10px;
    font-size:18px;font-weight:800;line-height:1}
  .cart-qty-input{width:46px;height:44px;padding:0 2px;border-radius:10px;
    font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
  .shop-item .mini-x{width:34px;min-width:34px;height:34px;border-radius:10px;

  .shop-item .mini-x:active{background:var(--out-tint);color:var(--out);border-color:#fca5a5}

  .shop-items{display:grid;gap:4px;padding:8px 11px}
  .stock-product-grid{display:grid;grid-template-columns:1fr;gap:4px;padding:0 8px 9px}
  .stock-product-grid.tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

  /* ── creation flows ───────────────────────────────────────────── */
  .shop-command .cart-quick{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px;
    padding:0;border:0;background:transparent;position:static}
  .cart-quick input{height:44px;min-width:0;border-radius:10px;font-size:14px;background:#fff}

  .stock-notice .btn{flex:0 0 auto;width:auto;min-height:38px;padding:0 12px;
    font-size:12px;white-space:nowrap}

  @media(max-width:360px){
    .stock-qty,.cart-qty-input{min-width:40px;width:40px}

  /* ══════════════════════════════════════════════════════════════════
     FLOATING ZO-AI
     Was the 6th slot in the bottom nav with a drawer docked above it.
     Now a launcher bubble + floating panel, present on every page.
     ══════════════════════════════════════════════════════════════════ */
  .zoai-fab{
    position:fixed; z-index:60;
    right:var(--side-gutter);
    bottom:calc(var(--nav-total) + var(--dock-h) + 14px + var(--safe-b));
    width:56px; height:56px; padding:0;
    display:grid; place-items:center;
    border:0; border-radius:50%;
    background:linear-gradient(145deg,var(--mark-a),var(--mark-b));
    color:#1a2822;
    box-shadow:0 10px 26px rgba(8,47,73,.34), 0 2px 6px rgba(8,47,73,.2);
    cursor:pointer;
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .zoai-fab .zoai-fab-icon{font-size:26px;line-height:1}
  .zoai-fab:active{transform:scale(.93)}
  .zoai-fab:focus-visible{outline:3px solid #7a9eaa;outline-offset:3px}
  /* Open state: turn the bubble into the panel's dismiss affordance. */
  body.chat-open .zoai-fab{
    background:#1a2822;color:#fff;
    box-shadow:0 6px 18px rgba(8,47,73,.3);
  }
  body.chat-open .zoai-fab .zoai-fab-icon{font-size:21px}
  body.chat-open .zoai-fab .zoai-fab-icon::before{content:'×'; font-size:24px; color:#fff}
  body.chat-open .zoai-fab .zoai-fab-icon svg{display:none}
  .zoai-fab .zoai-fab-icon svg{color:#fff}
  body.chat-open .zoai-fab .zoai-fab-icon::before{font-size:26px;font-weight:300;line-height:1}

  .chat-panel.chat-float{
    position:fixed; z-index:59;
    right:var(--side-gutter);
    bottom:calc(var(--nav-total) + var(--dock-h) + 80px + var(--safe-b));
    width:min(380px, calc(100vw - (var(--side-gutter) * 2)));
    max-height:min(62dvh,520px);
    border:1px solid #d5e4e8;
    border-radius:20px;
    box-shadow:0 24px 60px rgba(8,47,73,.28), 0 4px 14px rgba(8,47,73,.14);
    overflow:hidden;
    transform-origin:bottom right;
  }
  body.chat-open .chat-panel.chat-float{
    display:flex;
    animation:zoaiIn .18s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes zoaiIn{
    from{opacity:0;transform:translateY(10px) scale(.97)}
    to{opacity:1;transform:none}
  }
  @media (prefers-reduced-motion:reduce){
    body.chat-open .chat-panel.chat-float{animation:none}
    .zoai-fab{transition:none}
  }
  .chat-panel.chat-float .chat-panel-head{padding:8px 12px;background:#f2f4f1}
  .chat-panel.chat-float .chat-panel-body{flex:1;min-height:0;overflow-y:auto}

  body.has-stock-dock .zoai-fab,body.has-store-dock .zoai-fab{
    bottom:calc(var(--nav-total) + var(--dock-h) + 14px + var(--safe-b));
  }
  body.has-stock-dock .chat-panel.chat-float,body.has-store-dock .chat-panel.chat-float{
    bottom:calc(var(--nav-total) + var(--dock-h) + 80px + var(--safe-b));
  }
  /* Adaptive filter sheet sits under FAB otherwise — park Zo-Ai while open */
  body.adaptive-open .zoai-fab,
  body.adaptive-open .chat-panel.chat-float,
  body.adaptive-open #chatScrim{visibility:hidden; pointer-events:none}
  body.matrix-fullscreen .chat-panel.chat-float,
  body.store-fullscreen .chat-panel.chat-float,
  body.matrix-fullscreen #chatScrim,
  body.store-fullscreen #chatScrim{display:none!important}
  body.matrix-fullscreen .zoai-fab,body.store-fullscreen .zoai-fab{
    display:grid!important; width:44px; height:44px; bottom:calc(12px + var(--safe-b)); right:12px; z-index:70;
    opacity:.92}
  body.mode-child .zoai-fab{bottom:calc(16px + var(--safe-b))}
  body.mode-child .chat-panel.chat-float{bottom:calc(82px + var(--safe-b))}

  @media(max-width:420px){
    .zoai-fab{width:52px;height:52px}
    .zoai-fab .zoai-fab-icon{font-size:21px}
    .chat-panel.chat-float{bottom:calc(var(--nav-total) + var(--dock-h) + 74px + var(--safe-b))}
  }

  /* ══════════════════════════════════════════════════════════════════
     CREATION SHEETS  (Liste einlesen · Bestandsbewegung · Produkt)
     The import sheet spent 381px — nearly half a phone screen — on a
     kicker, a headline, a paragraph and a 2-column context grid that
     orphaned its third chip. Controls now start near the top.
     ══════════════════════════════════════════════════════════════════ */

  /* Context stats: one compact row, no orphan cell. */
  .import-context{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:4px;
  }
  .import-context > *{
    min-width:0;padding:4px 9px;border-radius:10px;
    background:#f6f9fc;border:1px solid #e8eef4;
  }
  /* No positional child selectors here: a chip is a bare label text node plus
     one value element, so that element matches BOTH :first-child and
     :last-child and inherited the label's text-transform (values rendered as
     "KALYVIA"). Style the box and the value element only. */
  .import-context > *{
    font-size:11px;font-weight:700;color:#8296ab;line-height:1.3;
  }
  .import-context > * b,
  .import-context > * strong,
  .import-context > * span{
    display:block;margin-top:2px;
    font-size:12px;font-weight:750;color:#1a2822;line-height:1.25;
    text-transform:none;letter-spacing:normal;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  .import-hero{padding:12px 13px;border-radius:14px}
  .import-kicker{font-size:11px;letter-spacing:.13em}
  .import-hero h2,.sheet h2{margin:3px 0 0;font-size:18px;letter-spacing:-.02em;line-height:1.2}
  /* The explainer is useful once, not on every open — keep it, shrink it. */
  .import-hero > p,.import-hero .muted{margin:5px 0 10px;font-size:11px;line-height:1.4}

  .import-source{padding:12px 13px;border-radius:14px}
  .import-source h3,.import-source > *:first-child{font-size:14px;letter-spacing:-.01em}
  .import-source textarea{min-height:96px;font-size:14px;line-height:1.45;border-radius:10px}
  /* German labels ("Screenshot / Foto wählen") clipped mid-word in a 2-up
     grid on phones. Stack them; side by side only when there is room. */
  .import-action-row{display:grid;grid-template-columns:1fr;gap:4px}
  .import-action-row .btn{margin:0;width:auto;min-height:46px;
    white-space:normal;line-height:1.25;padding:8px 12px}
  @media(min-width:480px){
    .import-action-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  }

  .screenshot-drop{padding:16px 12px;border-radius:14px}
  .screenshot-drop .big{font-size:26px;line-height:1}
  .screenshot-drop b,.screenshot-drop strong{font-size:13px}

  /* Sheet chrome: keep the close affordance reachable while scrolling. */
  .sheet{border-radius:20px 20px 0 0}
  .sheet .grabber{margin:8px auto 4px; width:42px; height:5px; border-radius:999px;
    background:rgba(26,40,34,.18)}
  /* sheet-close already unified */

  /* Stock movement / product creation rows share the list rhythm. */
  .stock-board-row,.product-qty-grid > *,.merge-choice > *{border-radius:10px}
  .merge-choice{display:grid;gap:4px}
  .merge-choice > *{padding:12px 12px}
  .status-box{border-radius:10px;padding:8px 12px;font-size:12px;line-height:1.4}

  @media(max-width:380px){
    .import-context{grid-template-columns:repeat(2,minmax(0,1fr))}
    .import-context > *:last-child{grid-column:1 / -1}
  }


  /* ── Food / category icons ───────────────────────────────────────────
     Sprite symbols carry no fill, so currentColor themes them with the
     surrounding text — they follow whatever palette is in play. */
  .cat-ico,.prod-ico,.detail-ico{fill:currentColor;flex:0 0 auto;
    display:inline-block;vertical-align:-2px}
  .cat-ico{width:20px;height:20px}
  .cat-ico-wrap{display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;border-radius:6px;
    background:color-mix(in srgb, var(--ink) 8%, transparent);color:var(--brand)}
  .prod-ico{width:16px;height:16px;margin-right:6px;opacity:.7;color:var(--muted)}
  .stock-product.low .prod-ico{color:var(--warn);opacity:1}
  .stock-product.empty .prod-ico{color:var(--out);opacity:1}
  .detail-ico{width:26px;height:26px}
  .stock-detail-icon{display:grid;place-items:center}

  /* Leftover hardcoded greys/reds from before the Aegean palette — these
     were tuned against the old white cards and fail on the new tints. */
  .stock-cat-count{color:var(--muted)}
  .stock-step.out{color:var(--out)}
  .stock-qty small{color:var(--muted)}
  .shop-item .mini-x{color:var(--muted)}
  .cart-step{color:var(--ink)}

  /* ── Adaptive chrome (mobile Filters sheet / desktop expanded) ───── */
  .adaptive-chrome{display:grid; gap:8px; margin:0 0 12px; position:relative}
  .adaptive-chrome-summary{
    display:none; width:100%; min-height:48px; align-items:center; justify-content:space-between;
    gap:8px; padding:8px 14px; text-align:left; border:1px solid var(--line);
    border-radius:14px; background:var(--glass-strong); color:var(--ink);
    box-shadow:var(--shadow); backdrop-filter:blur(10px); cursor:pointer; touch-action:manipulation;
    font:inherit; font-weight:650}
  .adaptive-chrome-summary .adaptive-summary-label{
    font-family:var(--font-display); font-size:14px; font-weight:700; letter-spacing:-.02em}
  .adaptive-chrome-summary .adaptive-summary-meta{font-size:12px; color:var(--muted); font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:55%}
  .adaptive-chrome-summary .adaptive-chevron{flex:0 0 auto; font-size:18px; opacity:.55}
  .adaptive-chrome-panel-head{display:none; align-items:center; justify-content:space-between;
    gap:8px; margin:0 0 10px}
  .adaptive-chrome-panel-head b{font-family:var(--font-display); font-size:16px}
  .adaptive-chrome-done{min-height:44px; min-width:72px; border-radius:10px; border:1px solid var(--line);
    background:#fff; font-weight:700; cursor:pointer; padding:0 14px}
  .adaptive-backdrop{display:none}

  body.layout-mobile .adaptive-chrome-summary{display:flex}
  body.layout-mobile .adaptive-chrome:not(.is-open) .adaptive-chrome-panel{display:none}
  body.layout-mobile .adaptive-chrome.is-open .adaptive-backdrop{
    display:block; position:fixed; inset:0; z-index:54; border:0; padding:0; margin:0;
    background:rgba(26,40,34,.42); backdrop-filter:blur(4px); cursor:pointer}
  body.layout-mobile .adaptive-chrome.is-open .adaptive-chrome-panel{
    display:block; position:fixed; left:0; right:0; bottom:0; z-index:55;
    max-height:min(72dvh,640px); overflow:auto; -webkit-overflow-scrolling:touch;
    margin:0; padding:12px 14px calc(16px + var(--safe-b));
    border-radius:20px 20px 0 0; border:1px solid var(--glass-edge); border-bottom:0;
    background:var(--glass-strong); box-shadow:0 -24px 60px rgba(26,40,34,.28);
    backdrop-filter:blur(22px) saturate(1.3); -webkit-backdrop-filter:blur(22px) saturate(1.3);
    animation:adaptiveUp .24s var(--ease-out)}
  body.layout-mobile .adaptive-chrome.is-open .adaptive-chrome-panel-head{display:flex}
  body.layout-mobile .adaptive-chrome.is-open .adaptive-chrome-summary .adaptive-chevron{transform:rotate(180deg)}
  @keyframes adaptiveUp{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
  @media(prefers-reduced-motion:reduce){body.layout-mobile .adaptive-chrome.is-open .adaptive-chrome-panel{animation:none}}
  body.layout-desktop .adaptive-chrome-summary,
  body.layout-desktop .adaptive-backdrop,
  body.layout-desktop .adaptive-chrome-panel-head{display:none!important}
  body.layout-desktop .adaptive-chrome-panel{display:block!important; position:static!important;
    max-height:none!important; padding:0!important; border:0!important; background:transparent!important;
    box-shadow:none!important; backdrop-filter:none!important; animation:none!important}
  body.layout-desktop .adaptive-chrome.planner-chrome-wrap .adaptive-chrome-panel{
    display:grid!important; gap:8px; padding:8px 8px!important;
    background:rgba(238,244,245,.94)!important; border:1px solid var(--plan-line)!important;
    border-radius:14px!important; box-shadow:0 10px 28px rgba(26,40,34,.08)!important;
    backdrop-filter:blur(12px)!important}
  body.layout-mobile .planner-chrome-wrap{margin:0 0 10px}
  body.layout-mobile header.app-chrome{padding:calc(6px + var(--safe-t)) 12px 8px; min-height:calc(52px + var(--safe-t))}
  body.layout-mobile{--header-h:52px}
  body.layout-mobile .store-decision{min-width:48px; width:48px; min-height:48px}
  body.layout-mobile .seg button, body.layout-mobile .planner-seg button{min-height:46px}

  /* ── Desktop left rail ───────────────────────────────────────────── */
  body.layout-desktop{--rail-w:92px}
  body.layout-desktop:not(.mode-child){--rail-w:220px}
  body.layout-desktop #app.app-shell{
    display:grid; grid-template-columns:var(--rail-w) minmax(0,1fr);
    grid-template-rows:auto 1fr; max-width:none; min-height:100dvh;
    padding-bottom:20px; gap:0}
  body.layout-desktop header.app-chrome{grid-column:2; grid-row:1; position:sticky; top:0}
  body.layout-desktop main.app-stage{grid-column:2; grid-row:2; max-width:1100px; width:100%;
    margin:0 auto; padding:16px 20px 28px}
  body.layout-desktop .bottom-panel{
    grid-column:1; grid-row:1 / -1; position:sticky; top:0; left:0; right:auto; bottom:auto;
    height:100dvh; max-width:none; margin:0; padding:12px 8px; pointer-events:auto;
    align-self:stretch; z-index:30}
  body.layout-desktop nav.dock{
    flex-direction:column; height:calc(100dvh - 24px); min-height:0; width:100%;
    border-radius:20px; padding:8px 6px; gap:4px; justify-content:flex-start}
  body.layout-desktop nav.dock button{
    flex:0 0 auto; width:100%; min-height:48px; border-radius:14px; font-size:11px; gap:4px;
    pointer-events:auto; cursor:pointer; touch-action:manipulation}
  body.layout-desktop .zoai-fab{
    right:max(16px, var(--side-gutter));
    bottom:calc(var(--nav-total) + var(--dock-h) + 18px + var(--safe-b))}
  body.layout-desktop .chat-panel.chat-float{
    right:max(16px, var(--side-gutter));
    bottom:calc(var(--nav-total) + var(--dock-h) + 86px + var(--safe-b))}
  body.layout-desktop.has-stock-dock .zoai-fab,
  body.layout-desktop.has-store-dock .zoai-fab{
    bottom:calc(var(--nav-total) + var(--dock-h) + 18px + var(--safe-b))}
  body.layout-desktop.has-stock-dock .chat-panel.chat-float,
  body.layout-desktop.has-store-dock .chat-panel.chat-float{
    bottom:calc(var(--nav-total) + var(--dock-h) + 86px + var(--safe-b))}
  /* Kids desktop: left chrome rail (kid-dock in #bottomPanel).
     ui-v110 sets --chrome white for staff — kids must keep dark rail or
     light-on-dark dock labels vanish and the left pane looks empty. */
  body.layout-desktop.mode-child{
    --rail-w:200px;
    --side-gutter:28px; /* stage padding — not the 1180px centering gutter */
  }
  body.layout-desktop.mode-child #app.app-shell{
