    grid-template-rows:auto 1fr; max-width:none; min-height:100dvh; padding-bottom:0; gap:0}
  body.layout-desktop.mode-child header.app-chrome{grid-column:2; grid-row:1}
  body.layout-desktop.mode-child .topbar-tools{display:none!important} /* rail owns nav */
  body.layout-desktop.mode-child main.app-stage{
    grid-column:2; grid-row:2; max-width:1120px; width:100%; margin:0; padding:20px 28px 32px}
  body.layout-desktop.mode-child .bottom-panel.is-kid-chrome{
    grid-column:1; grid-row:1 / -1; position:sticky; top:0; left:0; right:auto; bottom:auto;
    height:100dvh; width:var(--rail-w); max-width:var(--rail-w); margin:0; padding:16px 10px;
    pointer-events:auto; align-self:stretch; z-index:40;

    box-shadow:inset -1px 0 0 rgba(255,255,255,.06)}
  body.layout-desktop.mode-child .bottom-panel.is-kid-chrome .dock-brand{
    display:flex!important; flex-direction:column; gap:4px; padding:8px 4px 14px; color:#fff}
  body.layout-desktop.mode-child .bottom-panel.is-kid-chrome .dock-brand-mark{
    width:36px; height:36px; border-radius:12px;
    background:var(--mark-a, #d9eb8c); color:#1b2822;
    display:grid; place-items:center; font-family:var(--font-ui); font-weight:800; font-size:16px}
  body.layout-desktop.mode-child .bottom-panel.is-kid-chrome .dock-brand-copy span{
    display:block; font-size:11px; font-weight:650; color:rgba(255,255,255,.55)}
  body.layout-desktop.mode-child .bottom-panel.is-kid-chrome .dock-brand-copy strong{
    display:block; font-family:var(--font-display); font-size:20px; font-weight:650; color:#fff}
  body.layout-desktop.mode-child .kid-dock{
    position:static!important; left:auto; right:auto; bottom:auto;

  body.layout-desktop.mode-child .kid-dock-label{

    color:rgba(255,255,255,.42)}

    flex:0 0 auto; width:100%; min-height:48px; border-radius:14px;
    display:flex; flex-direction:row; justify-content:flex-start; align-items:center;
    gap:10px; padding:10px 12px; font-size:13px; font-weight:650; place-items:unset;
    color:rgba(255,255,255,.72)!important; background:transparent}
  body.layout-desktop.mode-child .kid-dock button span{display:inline; font-size:13px; white-space:nowrap}
  body.layout-desktop.mode-child .kid-dock button.on{
    color:#fff!important; background:rgba(255,255,255,.12)!important}
  body.layout-desktop.mode-child .kid-dock .nav-ico,
  body.layout-desktop.mode-child .kid-dock .ui-ico{margin:0; opacity:.85; color:inherit}

  body.layout-desktop.store-fullscreen #app.app-shell,
  body.layout-desktop.matrix-fullscreen #app.app-shell{grid-template-columns:1fr}
  body.layout-desktop.store-fullscreen header.app-chrome,
  body.layout-desktop.store-fullscreen main.app-stage,
  body.layout-desktop.matrix-fullscreen header.app-chrome,
  body.layout-desktop.matrix-fullscreen main.app-stage{grid-column:1}
  body.layout-desktop .topbar-tools{flex-wrap:wrap; overflow:visible}

  /* ── Nav icons: real SVGs replacing emoji ────────────────────────────
     No fill in the source files, so currentColor follows the nav's
     inactive/active state. Explicit size is REQUIRED — an unsized inline
     <svg> defaults to ~300px and swallows the viewport. */
  .nav-ico{width:22px;height:22px;display:block;margin:0 auto;
    fill:currentColor;color:inherit;flex:0 0 auto}
  nav.dock button .nav-ico{opacity:.72;transition:opacity .15s ease, transform .18s var(--ease-out)}
  nav.dock button.on .nav-ico{opacity:1; transform:translateY(-1px)}
  @media(max-width:420px){ .nav-ico{width:20px;height:20px} }

  /* Contrast: var(--out) on the tinted chip measured 4.37:1 at 13px, under the
     4.5 minimum. Darkened one step; hue unchanged. */
  .stock-chip.empty b,.stock-chip .empty b{color:var(--out)}

  /* Shop hub + take list (inside .shop-command) */
  .shop-command .shop-hub-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:0}
  .shop-stat{border:1px solid var(--line);border-radius:10px;background:#f2f4f1;padding:6px 4px;text-align:center}
  .shop-stat b{display:block;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;color:#1a2822}
  .shop-stat span{display:block;font-size:10px;font-weight:700;color:#6b8a94;margin-top:2px}
  .shop-stat.warn b{color:#c2410c}
  .shop-command .shop-panel-seg{margin:0}
  .shop-quick-actions{display:flex;gap:4px;margin:0}
  .shop-quick-actions .btn{flex:1;margin:0;min-width:0;white-space:nowrap}
  .shop-take-card{margin-bottom:10px;padding:12px 13px}
  .shop-take-h{display:grid;gap:2px;margin-bottom:8px}
  .shop-take-h b{font-size:13px;font-weight:800;color:#1a2822}

  .shop-take-name{flex:1;min-width:0;display:flex;align-items:center;gap:6px;color:#1a2822}

  .shop-take-card .shop-empty.compact{margin:0;border:0;background:transparent;padding:16px 4px 8px}

  /* Liste Αιτήματα / Anfragen */
  .req-easy-row{padding:0}
  .req-cta{width:100%;min-height:52px;font-size:16px;font-weight:800;letter-spacing:-.01em}
  .req-form{display:grid;gap:10px;margin-top:12px}

  .req-filters{display:grid;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line,#e6ebe7)}
  .req-filters .seg{flex-wrap:wrap}
  .req-who-filter{display:grid;gap:4px;font-size:11px;font-weight:700;color:var(--muted,#4a6a74)}
  .req-who-filter select{min-height:40px;border-radius:10px;border:1px solid var(--line,#e6ebe7);padding:0 10px;background:#fff}
  .req-items{display:grid;gap:6px;padding:10px 12px 14px}
  .req-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;
    padding:10px 12px;border:1px solid var(--line,#e8eef4);border-radius:var(--radius-sm,12px);
    background:rgba(255,255,255,.94)}

  .req-item.selected{border-color:var(--sea,#2f5a63);box-shadow:0 0 0 1px rgba(47,90,99,.2)}
  .req-item-main{min-width:0;display:grid;gap:3px}
  .req-item-name{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink,#1a2822)}
  .req-item-name b{font-weight:750}
  .req-item-sub{font-size:11px;color:var(--muted,#4a6a74);line-height:1.35}
  .req-status.pill{display:inline-flex;align-self:start;margin-top:2px;padding:2px 8px;border-radius:999px;
    font-size:10px;font-weight:800;letter-spacing:.02em;background:#eef2f7;color:#4a6a74}
  .req-status.open{background:rgba(47,90,99,.12);color:#2f5a63}
  .req-status.accepted{background:rgba(34,120,80,.12);color:#1d6b45}
  .req-status.bought{background:rgba(34,120,80,.18);color:#145c38}
  .req-status.rejected{background:var(--out-tint,#fee2e2);color:var(--out,#b91c1c)}
  .req-item-actions{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
  .req-item-actions .btn{margin:0;white-space:nowrap}
  body.mode-easy .req-item-actions .btn{min-height:44px;padding:0 14px;font-size:13px}
  @media(max-width:520px){
    .req-item{grid-template-columns:minmax(0,1fr)}
    .req-item:has(.bulk-check){grid-template-columns:auto minmax(0,1fr)}
    .req-item-actions{justify-content:stretch}
    .req-item-actions .btn{flex:1}
  }

  /* Schedule calendar month — planner-scoped (cal-sheet keeps its own .cal-actions) */
  .plan-calendar .cal-shell{
    background:rgba(255,255,255,.92);border:1px solid var(--plan-line);border-radius:20px;
    padding:14px 12px;margin-bottom:12px;box-shadow:0 8px 24px rgba(26,40,34,.06);
  }
  .plan-calendar .cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .plan-calendar .cal-head .cal-nav{
    flex:0 0 auto;min-width:44px;min-height:44px;padding:0 12px;border-radius:12px;
    font-size:18px;line-height:1;font-weight:700;
  }
  .plan-calendar .cal-month{flex:1;text-align:center;min-width:0}
  .plan-calendar .cal-month-kicker{
    display:block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    color:var(--plan-meta);margin-bottom:2px;
  }
  .plan-calendar .cal-month-title{
    display:block;font-family:var(--font-display);font-size:clamp(15px,4.2vw,17px);
    font-weight:750;color:var(--plan-deep);text-transform:capitalize;line-height:1.15;
  }
  .plan-calendar .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px}
  .plan-calendar .cal-weekdays span{
    text-align:center;font-size:11px;font-weight:750;color:var(--plan-meta);
    letter-spacing:.04em;text-transform:uppercase;
  }
  .plan-calendar .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .plan-calendar .cal-cell{
    aspect-ratio:1;min-height:44px;border:1.5px solid var(--plan-line);border-radius:12px;
    background:rgba(255,255,255,.78);display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:3px;font-size:13px;font-weight:700;cursor:pointer;padding:4px 2px;
    color:var(--plan-ink);font-variant-numeric:tabular-nums;
  }
  .plan-calendar .cal-cell.empty{background:transparent;border:0;cursor:default;min-height:0}
  .plan-calendar .cal-cell.today{
    border-color:var(--plan-sun);background:rgba(255,255,255,.95);
    box-shadow:0 0 0 2px rgba(196,138,26,.28);
  }
  .plan-calendar .cal-cell.today .cal-n{color:var(--plan-sun)}
  .plan-calendar .cal-cell.on{
    background:linear-gradient(160deg,var(--plan-deep),var(--plan-sea));border-color:transparent;color:#fff;
    box-shadow:0 6px 14px rgba(26,40,34,.22);
  }
  .plan-calendar .cal-cell.on.today .cal-n{color:#fff}
  .plan-calendar .cal-n{line-height:1}
  .plan-calendar .cal-dots{display:flex;gap:3px;height:5px;align-items:center}
  .plan-calendar .cal-dots i{display:block;width:5px;height:5px;border-radius:50%}
  .plan-calendar .cal-dots i.ev{background:var(--plan-sun)}
  .plan-calendar .cal-dots i.tk{background:var(--plan-sea)}
  .plan-calendar .cal-cell.on .cal-dots i.ev,.plan-calendar .cal-cell.on .cal-dots i.tk{background:rgba(255,255,255,.88)}
  .plan-calendar .cal-legend{
    display:flex;flex-wrap:wrap;gap:10px 14px;margin:0 0 10px;font-size:11px;font-weight:650;color:var(--plan-meta);
  }
  .plan-calendar .cal-legend span{display:inline-flex;align-items:center;gap:5px}
  .plan-calendar .cal-legend i{display:inline-block;width:6px;height:6px;border-radius:50%}
  .plan-calendar .cal-legend i.ev{background:var(--plan-sun)}
  .plan-calendar .cal-legend i.tk{background:var(--plan-sea)}
  .plan-calendar .cal-shell .cal-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 8px;align-items:center}
  .plan-calendar .cal-shell .cal-actions .btn{min-height:44px}
  .plan-calendar .cal-notif-pill{
    display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;
    font-size:12px;font-weight:650;color:var(--plan-meta);
  }
  .plan-calendar .cal-upcoming{margin-top:10px}
  .plan-calendar .cal-upcoming .block-h{margin-bottom:8px}

  /* ══════════════════════════════════════════════════════════════════════
     ARMONIA DESIGN SYSTEM v2 — implementation of design/VISUAL_MOTION_SYSTEM.md
     Appended last so it wins on source order without !important wars.
     Class names are unchanged: app.js markup keeps working as-is.
     §refs point at sections of the spec doc.
     ══════════════════════════════════════════════════════════════════════ */

  /* ── §7 Tokens ─────────────────────────────────────────────────────── */
  :root{
    /* Stone — warm quarried neutral, never cool gray */
    --stone-50:#f3f5f2;
    --stone-100:#e9ece8;
    --stone-200:#d4dbd5;
    --stone-300:#c3ccc4;
    /* Hairlines */
    --line:rgba(26,40,34,.12);
    --line-strong:rgba(26,40,34,.20);
    /* Brand washes (derived, so a hex change propagates) */
    --pine-tint:color-mix(in srgb, var(--brand) 10%, transparent);
    --pine-wash:color-mix(in srgb, var(--brand) 16%, transparent);
    --sea-deep:#1a3a42;
    --amber-tint:color-mix(in srgb, var(--sun) 10%, transparent);
    --out-tint:color-mix(in srgb, var(--out) 10%, transparent);
    /* Glass */
    --glass:rgba(255,255,255,.64);
    --glass-strong:rgba(255,255,255,.86);
    --glass-rim:rgba(255,255,255,.55);
    --chrome:rgba(26,40,34,.90);
    /* Radius */
    --radius-sm:12px;
    --radius:18px;
    --radius-lg:20px;
    --radius-dock:24px;
    --radius-pill:999px;
    /* Space — 4/8 base, single scale (§3) */
    --space-1:4px;  --space-2:8px;  --space-3:12px; --space-4:16px;
    --space-5:20px; --space-6:24px; --space-8:32px; --space-10:40px;
    --space-12:48px;--space-16:64px;--space-20:80px;
    /* Elevation — tinted ink shadows only, never black, never >40px blur (§4) */
    --shadow:0 10px 28px rgba(26,40,34,.10);
    --shadow-1:0 6px 18px rgba(26,40,34,.08);
    --shadow-2:0 18px 40px rgba(26,40,34,.14);
    --blur-1:10px;
    --blur-2:16px;
    /* Type (§2) */
    --t-display-xl:clamp(2rem,6vw,2.75rem);
    --t-display-lg:clamp(1.75rem,4vw,2.1rem);
    --t-display-md:1.375rem;
    --t-display-sm:1.125rem;
    --t-numeral:1.75rem;
    --t-body-lg:1.05rem;
    --t-body:1rem;
    --t-body-sm:.9rem;
    --t-label:.85rem;
    --t-caption:.8125rem;
    --t-eyebrow:.6875rem;
    --t-micro:.625rem;
    /* Motion (§5) */
    --m-fast:120ms;
    --m-base:220ms;
    --m-slow:380ms;
    --m-reveal:480ms;
    --m-stagger-sm:60ms;
    --m-stagger-md:80ms;
    --ease-settle:cubic-bezier(.2,.8,.2,1);
    --ease-tide:cubic-bezier(.65,0,.35,1);
    --ease-out:var(--ease-settle);
    /* Focus */
    --focus:0 0 0 2px var(--stone-50), 0 0 0 4px var(--brand);
  }

  /* ── §4/§0 Ambient canvas — stone gradient + required grain layer ──── */
  body::before{
    background:
      radial-gradient(ellipse 92% 54% at 108% -10%, var(--amber-tint), transparent 54%),
      radial-gradient(ellipse 74% 50% at -14% 22%, var(--pine-tint), transparent 50%),
      radial-gradient(ellipse 52% 38% at 50% 112%, color-mix(in srgb, var(--sea) 9%, transparent), transparent 56%),
      linear-gradient(168deg, var(--stone-50) 0%, #e6ebe6 46%, var(--stone-200) 100%);
  }
  /* Grain is what separates "real place" from "stock gradient" (§8) */
  body::after{opacity:.032}

  /* ── §2 Type scale ─────────────────────────────────────────────────── */
  /* Family and rhythm only — root font-size stays with the existing rules so
     the >=900px desktop density step (14px) keeps working. The `font`
     shorthand would silently reset it. */
  html,body{font-family:var(--font-ui); line-height:1.5; font-optical-sizing:auto;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility}
  h1,h2,h3,h4{font-family:var(--font-display); text-wrap:balance;
    letter-spacing:-.02em; margin-block:0}
  p,li{text-wrap:pretty}
  .card h2{font-size:var(--t-display-sm); line-height:1.25; letter-spacing:0;
    margin:0 0 var(--space-2); font-weight:600}
  .hero h1,.home-mast h1{font-size:var(--t-display-lg); line-height:1.12; font-weight:700}
  .eyebrow{font-family:var(--font-ui); font-size:var(--t-eyebrow); font-weight:700;
    line-height:1.3; letter-spacing:.14em; text-transform:uppercase; color:var(--sea)}
  .muted{font-size:var(--t-body-sm); line-height:1.45; color:var(--muted)}
  label,.label{font-size:var(--t-label); font-weight:600; line-height:1.3}
  .chip,.pill{font-size:var(--t-caption); font-weight:600; line-height:1.35}
  /* Data legibility: counts, times, prices must not jitter as they update */
  .n,.qty,.stock-qty,.cart-qty-input,.qty-field,.stock-step,.tile b,.day,.wk,
  time,.price,[data-count],.matrix-label,.plan-day-chip{
    font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}
  /* Fraunces numerals carry the brand — don't flatten them to a sans (§2) */
  .tile b,.bento-tile b,.status-box strong{
    font-family:var(--font-display); font-size:var(--t-numeral); font-weight:700;
    line-height:1; letter-spacing:-.01em; font-variant-numeric:tabular-nums}

  /* ── §4 Elevation — glass over stone, hierarchy by fill + hairline ─── */
  .card,.bento-tile,.tile,.stock-product,.shop-item,.memory-card,.help-center-card,
  .talk-video-card,.status-box,.empty-state{
    background:var(--glass);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow-1);
    backdrop-filter:blur(var(--blur-1)) saturate(1.15);
    -webkit-backdrop-filter:blur(var(--blur-1)) saturate(1.15);
  }
  .card{padding:var(--space-4); margin-bottom:var(--space-3)}
  /* Glass-2 — genuinely floating layers only. One at a time on screen. */
  .sheet,.tutorial-card,.chat-panel{
    background:var(--glass-strong);
    border:1px solid var(--line);
    box-shadow:var(--shadow-2);
    backdrop-filter:blur(var(--blur-2)) saturate(1.2);
    -webkit-backdrop-filter:blur(var(--blur-2)) saturate(1.2);
  }
  .sheet{border-radius:var(--radius-lg) var(--radius-lg) 0 0; border-bottom:0;
    box-shadow:0 -18px 40px rgba(26,40,34,.14)}
  /* 1px rim of light along the top edge of raised glass (§4 glass-rim).
     Done as a border edge, not a pseudo-element: .sheet scrolls its own
     content, so an absolutely-positioned rim would scroll out of view. */
  .sheet{border-top:1px solid var(--glass-rim)}

  /* ── §5.2 Pine settle — the highest-frequency motion, so the quietest ─
     Fast press-in, slower settle-back. No overshoot, no colour flash.     */
  .btn,.page-act,.chip,.pill,.tile,.topbtn,.bento-tile,.seg button,.stock-step,
  .plan-day-chip,.stock-chip,.zoai-fab{
    transition:transform var(--m-base) var(--ease-settle),
               box-shadow var(--m-base) var(--ease-settle),
               background-color var(--m-fast) linear,
               border-color var(--m-fast) linear;
  }
  .btn:active,.page-act:active,.chip:active,.pill:active,.topbtn:active,
  .seg button:active,.stock-step:active,.plan-day-chip:active,.stock-chip:active{
    transform:scale(.98);
    box-shadow:var(--shadow-1);
    transition-duration:var(--m-fast);
  }
  .tile:active,.bento-tile:active{transform:scale(.97); transition-duration:var(--m-fast)}
  .zoai-fab:active{transform:scale(.94); transition-duration:var(--m-fast)}

  /* ── §5.1 Tide-line reveal — once per navigation, hero surfaces only ── */
  @keyframes tide-reveal{
    from{opacity:0; transform:translateY(var(--space-2)); clip-path:inset(0 0 62% 0)}
    to  {opacity:1; transform:none;                       clip-path:inset(0 0 0 0)}
  }
  .hero > *,.home-mast > *,.import-hero > *,.gal-hero > *,.gate-head > *{
    animation:tide-reveal var(--m-reveal) var(--ease-tide) both}
  .hero > *:nth-child(2),.home-mast > *:nth-child(2),.gate-head > *:nth-child(2){
    animation-delay:var(--m-stagger-sm)}
  .hero > *:nth-child(3),.home-mast > *:nth-child(3),.gate-head > *:nth-child(3){
    animation-delay:calc(var(--m-stagger-sm) * 2)}
  .hero > *:nth-child(n+4),.home-mast > *:nth-child(n+4),.gate-head > *:nth-child(n+4){
    animation-delay:calc(var(--m-stagger-sm) * 3)}

  /* ── §5.3 Handover ribbon — sequential lists draw in, capped at 5 ───── */
  @keyframes ribbon-in{
    from{opacity:0; transform:translateY(var(--space-2))}
    to{opacity:1; transform:none}
  }
  .dashboard-grid > *,.plan-block,.entry,.chat-msg,
  .lesson-row,.sp-block,.aufgabe-card{
    animation:ribbon-in var(--m-base) var(--ease-settle) both}
  .dashboard-grid > *:nth-child(1),.plan-block:nth-child(1),.entry:nth-child(1),
  .lesson-row:nth-child(1),.sp-block:nth-child(1),.aufgabe-card:nth-child(1){animation-delay:0ms}
  .dashboard-grid > *:nth-child(2),.plan-block:nth-child(2),.entry:nth-child(2),
  .lesson-row:nth-child(2),.sp-block:nth-child(2),.aufgabe-card:nth-child(2){animation-delay:var(--m-stagger-md)}
  .dashboard-grid > *:nth-child(3),.plan-block:nth-child(3),.entry:nth-child(3),
  .lesson-row:nth-child(3),.sp-block:nth-child(3),.aufgabe-card:nth-child(3){animation-delay:calc(var(--m-stagger-md) * 2)}
  .dashboard-grid > *:nth-child(4),.plan-block:nth-child(4),.entry:nth-child(4),
  .lesson-row:nth-child(4),.sp-block:nth-child(4),.aufgabe-card:nth-child(4){animation-delay:calc(var(--m-stagger-md) * 3)}
  .dashboard-grid > *:nth-child(5),.plan-block:nth-child(5),.entry:nth-child(5),
  .lesson-row:nth-child(5),.sp-block:nth-child(5),.aufgabe-card:nth-child(5){animation-delay:calc(var(--m-stagger-md) * 4)}
  /* Beyond 5 items: land instantly, never make a long list wait */
  .dashboard-grid > *:nth-child(n+6),.plan-block:nth-child(n+6),
  .entry:nth-child(n+6),.chat-msg:nth-child(n+6),
  .lesson-row:nth-child(n+6),.sp-block:nth-child(n+6),.aufgabe-card:nth-child(n+6){
    animation-delay:0ms; animation-duration:var(--m-fast)}

  /* ── Primitives ────────────────────────────────────────────────────── */
  .btn{border-radius:var(--radius-sm); padding:var(--space-3) var(--space-4);
    min-height:var(--space-12); font-size:var(--t-label); font-weight:700;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));
    box-shadow:0 6px 16px color-mix(in srgb, var(--brand) 24%, transparent)}
  .btn.sm{padding:var(--space-2) var(--space-3); min-height:40px;
    font-size:var(--t-caption); border-radius:10px}
  .chip,.pill{border-radius:var(--radius-pill); padding:var(--space-2) var(--space-3);
    min-height:36px; border:1px solid var(--line); background:var(--glass-strong)}
  .chip.on,.pill.on,.plan-day-chip.on,.stock-chip.on{
    background:var(--pine-tint); border-color:color-mix(in srgb, var(--brand) 34%, transparent);
    color:var(--brand)}
  .seg{background:var(--pine-tint); border-radius:var(--radius-sm); padding:3px;
    gap:2px; margin-bottom:var(--space-3)}
  .seg button{border-radius:10px; font-size:var(--t-caption); font-weight:600;
    color:var(--muted); min-height:var(--space-12)}
  .seg button.on{background:#fff; color:var(--ink); box-shadow:var(--shadow-1); font-weight:700}
  .page-act{border-radius:var(--radius-sm); padding:var(--space-2) var(--space-4);
    min-height:44px; font-size:var(--t-caption); font-weight:700;
    background:var(--glass-strong); box-shadow:var(--shadow-1)}
  .page-actions{
    gap:var(--space-2); margin-bottom:var(--space-3);
    padding:var(--space-2); border-radius:var(--radius);
    background:var(--glass); border:1px solid var(--line);
    box-shadow:var(--shadow-1); backdrop-filter:blur(10px)}
  .page-actions .page-act{background:var(--glass-strong)}
  .chat-panel.chat-float{
    background:var(--glass-strong)!important;
    border:1px solid var(--line)!important;
    box-shadow:var(--shadow-2)!important;
    border-radius:var(--radius)!important}
  .chat-panel.chat-float .chat-panel-head{
    background:var(--glass)!important; border-bottom:1px solid var(--line)}
  .chat-panel.chat-float .chat-panel-title{color:var(--ink)!important;
    font-family:var(--font-display); letter-spacing:-.02em}

  /* Inputs go fully opaque — glass is for display, not for typing counts under
     time pressure (§4 "when opacity goes to 100%") */
  input,select,textarea,.qty-field,.cart-qty-input{
    background:#fff; border:1px solid var(--line-strong); border-radius:var(--radius-sm);
    color:var(--ink); accent-color:var(--brand)}
  input:focus-visible,select:focus-visible,textarea:focus-visible,
  .btn:focus-visible,.chip:focus-visible,.page-act:focus-visible,
  .topbtn:focus-visible,.tile:focus-visible,.dock button:focus-visible,
  .zoai-fab:focus-visible,.seg button:focus-visible{
    outline:none; box-shadow:var(--focus)}

  /* ── Shell: chrome header — compact, sea-deep, one hairline ────────── */
  header.app-chrome{
    padding:calc(var(--space-2) + var(--safe-t)) var(--space-4) var(--space-2);
    gap:var(--space-1);
    background:color-mix(in srgb, var(--sea-deep) 88%, transparent);
    border-bottom:1px solid rgba(255,255,255,.10);
    box-shadow:0 10px 28px rgba(26,40,34,.16);
    backdrop-filter:blur(var(--blur-2)) saturate(1.25);
    -webkit-backdrop-filter:blur(var(--blur-2)) saturate(1.25)}
  header.app-chrome::before{
    background:linear-gradient(120deg,
      color-mix(in srgb, var(--mark-a) 12%, transparent),
      transparent 46%,
      color-mix(in srgb, var(--sea) 22%, transparent));
    opacity:.85}
  .brand-mark{border-radius:11px; box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
  .brand-kicker-live{font-size:var(--t-eyebrow); letter-spacing:.14em; color:var(--mark-a)}
  header h1{font-size:clamp(17px,4.4vw,20px); letter-spacing:-.02em; font-weight:700}

  /* ── Shell: dock — §4 "chrome, inverted". Written at `nav.dock` because
     the shipped rule is, and equal specificity + source order is a more
     debuggable way to win than !important.
     Geometry keeps the floating-pill shape: the dock is detached from the
     screen edge, so all four corners round rather than the top two. ──── */
  nav.dock{
    background:var(--chrome);
    border:1px solid rgba(255,255,255,.10);
    border-radius:var(--radius-dock);
    padding:var(--space-1);
    box-shadow:0 14px 36px rgba(26,40,34,.24), inset 0 1px 0 rgba(255,255,255,.10);
    backdrop-filter:blur(12px) saturate(1.2);
    -webkit-backdrop-filter:blur(12px) saturate(1.2)}
  nav.dock button{
    color:rgba(255,255,255,.66);
    border-radius:var(--radius-sm);
    font-size:var(--t-micro); font-weight:600; letter-spacing:.02em; gap:3px;
    transition:color var(--m-fast) linear, background-color var(--m-fast) linear,
               transform var(--m-base) var(--ease-settle)}
  nav.dock button.on{
    color:var(--mark-a); font-weight:700;
    background:rgba(255,255,255,.10);
    box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--mark-a) 22%, transparent)}
  nav.dock button .nav-ico{opacity:.82}
  nav.dock button.on .nav-ico{opacity:1; transform:translateY(-1px) scale(1.06)}
  nav.dock button:active{transform:scale(.97)}
  /* Staff header sets its own padding at `body:not(.mode-child)` — meet it. */
  body:not(.mode-child) header.app-chrome{
    padding:calc(var(--space-2) + var(--safe-t)) var(--space-4) var(--space-2);
    gap:var(--space-1)}

  /* ── Shell: sheets, toast, FAB ─────────────────────────────────────── */
  .sheet{transition:transform var(--m-slow) var(--ease-settle); padding-inline:var(--space-4)}
  .sheet .grabber{background:var(--line-strong)}
  .toast{border-radius:var(--radius-sm); padding:var(--space-3) var(--space-5);
    background:var(--chrome); box-shadow:var(--shadow-2);
    font-size:var(--t-body-sm); font-weight:600;
    transition:opacity var(--m-base) var(--ease-settle), transform var(--m-base) var(--ease-settle)}
  .zoai-fab{box-shadow:0 10px 28px color-mix(in srgb, var(--brand) 30%, transparent)}

  /* ── Density: compact, information-first rows (§3) ─────────────────── */
  .dashboard-grid{gap:var(--space-2)}
  .bento-tile{padding:var(--space-3)}
  .tile{border-radius:var(--radius-sm); padding:var(--space-3) var(--space-2) var(--space-2);
    gap:var(--space-1); min-height:62px}
  .stock-product,.shop-item{border-radius:var(--radius-sm); padding:var(--space-3)}
  .row{gap:var(--space-2)}
  /* Components adapt to the space they're given, not the viewport */
  .dashboard-grid,.stock-board{container-type:inline-size}
  @container (min-width:520px){
    .bento-tile{padding:var(--space-4)}
  }

  /* ── State colour semantics ────────────────────────────────────────── */
  .ok,.in,.done{color:var(--in)}
  .out,.late,.low{color:var(--out)}
  .warn{color:var(--warn)}
  .today{background:var(--amber-tint); border-color:color-mix(in srgb, var(--sun) 36%, transparent)}
  .status-pill{border-radius:var(--radius-pill); padding:3px var(--space-2);
    font-size:var(--t-eyebrow); font-weight:700; letter-spacing:.06em; text-transform:uppercase}

  /* ── Empty states — restraint and space, not confetti (§8 board 03) ── */
  .empty-state{padding:var(--space-8) var(--space-5); text-align:center;
    background:var(--glass); border-radius:var(--radius-lg); gap:var(--space-2)}
  .empty-state .empty-title{font-family:var(--font-display); font-size:var(--t-display-md);
    font-weight:600; line-height:1.2; letter-spacing:-.01em}
  .empty-state .empty-hint{font-size:var(--t-body-sm); color:var(--muted); max-width:34ch;
    margin-inline:auto; line-height:1.45}

  /* ── §6 No dark theme, by decision. Dusk stays out of scope for v1. ── */

  /* ── Performance / accessibility guards ────────────────────────────── */
  /* Cheap opt-out for devices where stacked backdrop blurs cost frames */
  @media (prefers-reduced-transparency:reduce){
    .card,.bento-tile,.tile,.sheet,.chat-panel,.stock-product,.shop-item,
    header.app-chrome,.dock{backdrop-filter:none; -webkit-backdrop-filter:none}
    .card,.bento-tile,.tile,.stock-product,.shop-item{background:rgba(255,255,255,.94)}
    .sheet,.chat-panel{background:#fff}
  }
  @media (prefers-reduced-motion:reduce){
    /* Swap every named motion for an instant opacity-only cross-fade (§5) */
    .hero > *,.home-mast > *,.import-hero > *,.gal-hero > *,.gate-head > *,
    .dashboard-grid > *,.plan-block,.entry,.chat-msg{
      animation:none; opacity:1; transform:none; clip-path:none}
    *,*::before,*::after{
      transition-duration:var(--m-fast)!important;
      animation-duration:var(--m-fast)!important;
      animation-iteration-count:1!important}
  }
  @media (prefers-contrast:more){
    :root{--line:rgba(26,40,34,.28); --line-strong:rgba(26,40,34,.42);
      --glass:rgba(255,255,255,.92); --glass-strong:#fff; --muted:#31423c}
  }

  /* ── Kids student app (Design System v2 / Kids page) ───────────────── */

  .kid-guide{

  .kid-guide-hint{font-size:var(--t-caption); color:var(--muted); line-height:1.4}
  .kid-guide-actions{display:flex; flex-wrap:wrap; gap:var(--space-2); align-items:center}

  .kid-first-run{
    display:flex; gap:var(--space-3); align-items:flex-start; justify-content:space-between;

  .kid-header{
    margin:calc(-1 * var(--space-2)) calc(-1 * var(--side-gutter,12px)) 0;
    padding:var(--space-4) var(--side-gutter,12px) var(--space-8);
    color:#fff;
    background:
      linear-gradient(145deg, color-mix(in srgb, var(--sea-deep) 88%, #000), transparent 55%),

    border-radius:0 0 var(--radius-lg) var(--radius-lg);
  }

  .kid-header h2{font-size:var(--t-display-md); font-weight:700; color:#fff; margin:var(--space-1) 0 0}
  .kid-header .kid-hello{font-size:var(--t-body-sm); color:color-mix(in srgb, #fff 70%, transparent); margin-top:var(--space-1)}
  .level-card{
    display:grid; grid-template-columns:auto 1fr; gap:var(--space-3); align-items:center;
    margin-top:calc(-1 * var(--space-6)); margin-bottom:var(--space-2);
    padding:var(--space-4); border-radius:var(--radius); background:var(--glass-strong);
    border:1px solid var(--line); box-shadow:var(--shadow-1); backdrop-filter:blur(var(--blur-1));
  }
  .level-card .level-copy{display:grid; gap:var(--space-1); min-width:0}
  .level-card .level-xp{font-size:var(--t-body); font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink)}
  .level-card .level-next{font-size:var(--t-caption); color:var(--muted)}
  .level-card .level-tag{font-size:var(--t-micro); font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--sea)}
  .progress-ring{display:block; width:64px; height:64px; flex:0 0 auto}

  .progress-ring .pr-track{stroke:var(--stone-200)}

  .progress-ring .pr-label{

  .level-meter > i{display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--brand),var(--brand-2));
    transition:width var(--m-base) var(--ease-settle)}

  .kid-panel-h{display:flex; align-items:baseline; justify-content:space-between; gap:var(--space-2)}
  .kid-panel-h b{font-family:var(--font-display); font-size:var(--t-display-sm); font-weight:700}

  .lesson-row{

  .course-grid{display:grid; grid-template-columns:1fr 1fr; gap:var(--space-2)}

    font-variant-numeric:tabular-nums}
  .sterne-hero{
    display:grid; gap:var(--space-3); padding:var(--space-4); border-radius:var(--radius);
    background:var(--glass-strong); border:1px solid var(--line); box-shadow:var(--shadow-1)}
  .sterne-top{display:grid; grid-template-columns:auto 1fr; gap:var(--space-3); align-items:center}
  .sterne-stats{display:grid; grid-template-columns:1fr 1fr; gap:var(--space-2)}
  .sterne-stat{
    padding:var(--space-3); border-radius:var(--radius-sm); background:color-mix(in srgb, var(--stone-50) 80%, #fff);
    border:1px solid var(--line)}
  .sterne-stat b{display:block; font-family:var(--font-display); font-size:var(--t-numeral); font-weight:800; font-variant-numeric:tabular-nums}
  .sterne-stat span{font-size:var(--t-caption); color:var(--meta)}
  .kid-streak{display:flex; gap:var(--space-1); align-items:center; flex-wrap:wrap}
  .kid-streak i{
    width:28px; height:28px; border-radius:var(--radius-sm); display:grid; place-items:center;
    font-size:var(--t-micro); font-weight:800; background:var(--stone-200); color:var(--muted);
    font-variant-numeric:tabular-nums}
  .kid-streak i.on{background:var(--pine-wash); color:var(--brand)}
  .badge-grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:var(--space-2)}
  .badge-tile{
    aspect-ratio:1; border-radius:var(--radius-sm); border:1px solid var(--line);
    background:var(--glass-strong); display:grid; place-items:center; gap:4px; padding:var(--space-2);
    text-align:center}
  .badge-tile.locked{opacity:.45; filter:grayscale(.4)}
  .badge-tile .bt-ico{font-size:22px; line-height:1}
  .badge-tile .bt-name{font-size:var(--t-micro); font-weight:700; color:var(--muted); line-height:1.2}
  .badge-tile .bt-ico svg,.ac-ico svg,.empty-state .empty-ico svg{
    display:block; width:22px; height:22px; fill:currentColor; margin:0 auto}
  .badge-tile .bt-ico{color:var(--sun)}
  .badge-tile.locked .bt-ico{color:var(--muted)}
  .ac-ico{color:var(--brand)}
  .empty-state .empty-ico{color:var(--sea); display:grid; place-items:center}
  .seg-progress{display:flex; gap:4px; width:100%}
  .seg-progress i{flex:1; height:6px; border-radius:var(--radius-pill); background:var(--stone-200)}
  .seg-progress i.on{background:var(--brand)}
  .seg-progress i.bad{background:var(--out)}
  .learn-choice.is-right{border-color:var(--brand)!important; background:var(--pine-wash)!important}
  .learn-choice.is-wrong{border-color:var(--out)!important; background:var(--out-tint)!important}
  .kid-secondary{display:flex; flex-wrap:wrap; gap:var(--space-2); margin-top:var(--space-1)}
  .kid-secondary .chip{min-height:44px}
  .kid-home{display:grid; gap:var(--space-3)}
  .kid-home-layout{display:grid; gap:var(--space-3)}
  .kid-home-main,.kid-home-aside{display:grid; gap:var(--space-3); align-content:start}
  .kid-home-cta-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--space-2)}
  .kid-home-cta-tile{
    display:grid; grid-template-columns:auto 1fr; gap:var(--space-2); align-items:center;
    text-align:left; min-height:56px; padding:var(--space-3); border-radius:var(--radius-sm);
    border:1px solid var(--line); background:var(--glass-strong); box-shadow:var(--shadow-1);
    font:inherit; font-weight:700; color:var(--ink); cursor:pointer; touch-action:manipulation}
  .kid-home-cta-tile:active{transform:scale(.985)}
  .kid-home-cta-ico{
    width:36px; height:36px; border-radius:12px; display:grid; place-items:center;
    background:var(--pine-tint); color:var(--brand)}
  .kid-home-cta-tile.sea .kid-home-cta-ico{background:color-mix(in srgb, var(--sea) 16%, #fff); color:var(--sea-deep)}
  .kid-home-cta-tile.sun .kid-home-cta-ico{background:var(--amber-tint, #f5e6c8); color:var(--sun)}
  .kid-home-cta-tile.out .kid-home-cta-ico{background:var(--out-tint); color:var(--out)}
  .kid-home-cta-ico .ui-ico{width:20px; height:20px}
  .kid-sub-chip-row{display:flex; flex-wrap:wrap; gap:8px}
  .kid-sub-chip{
    display:inline-flex; align-items:center; gap:8px; min-height:40px; padding:8px 12px;
    border-radius:999px; border:1px solid var(--line); background:#fff; font:inherit; cursor:pointer}
  .kid-sub-chip strong{font-variant-numeric:tabular-nums; color:var(--sea)}
  .kid-home-empty{display:grid; gap:10px; justify-items:start}
  .next-up.next-up-idle{grid-template-columns:46px 1fr auto}
  .next-up .nu-ring .ui-ico{width:22px; height:22px; color:#fff}
  .kid-rate-layout{display:grid; gap:var(--space-3)}
  @media (min-width:700px){
    .kid-home-cta-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .kid-home-layout{grid-template-columns:minmax(0,1.2fr) minmax(240px,.9fr); align-items:start}
    .kid-rate-layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr); align-items:start}
    body.mode-child:not(.layout-desktop) .kid-shell{max-width:820px; margin-inline:auto}
    body.mode-child:not(.layout-desktop) main.app-stage{padding-inline:20px}
  }
  @media (max-width:380px){
    .kid-dock button span{font-size:9px}
    .course-grid{gap:var(--space-1)}
    .sp-day{padding:var(--space-1); min-height:48px}
  }
  @media (min-width:600px){
    .course-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .badge-grid{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}
  }
  @media (min-width:900px){
    body.mode-child .kid-shell{max-width:none; margin-inline:0}
    .course-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  }
  @media (orientation:landscape) and (max-height:480px){
    .kid-header{padding:var(--space-3) var(--side-gutter,12px) var(--space-6)}
    .kid-dock{min-height:52px}
    .kid-dock button{min-height:48px; padding:6px 2px}
    .level-card{margin-top:calc(-1 * var(--space-4)); padding:var(--space-3)}
  }

  /* ══════════════════════════════════════════════════════════════════════
     STAFF HOME — alignment with the Figma Screens frames
     The token layer shipped in v78 but the staff screens kept their
     pre-redesign structure: a dark gradient hero and a full-bleed crimson
     shift banner built on Tailwind rose (var(--out)/var(--out)), colours that
     appear nowhere in the system. Per the design doc, terracotta is an
     attention accent — never a wash — and hero copy sits on stone, not on
     a dark card. Markup is untouched; this is styling only.
     ══════════════════════════════════════════════════════════════════════ */

  /* ── Hero: stone canvas, ink type (Figma "Home" mast) ──────────────── */
  .home-mast{
    background:none; color:var(--ink); box-shadow:none; border:0;
    padding:var(--space-2) 0 var(--space-3); overflow:visible;
    /* flex so the eyebrow can be ordered above the wordmark without
       touching the markup, matching the Figma hero stack */
    display:flex; flex-direction:column; align-items:flex-start}
  .home-mast::after{content:none}
  .home-mast .home-brand{
    color:var(--ink); font-size:var(--t-display-lg); font-weight:700; letter-spacing:-.02em}
  .home-mast .home-hello{
    order:-1; margin:0 0 var(--space-1);
    font-size:var(--t-eyebrow); font-weight:700; letter-spacing:.14em;
    text-transform:uppercase; color:var(--sea)}
  .home-mast h2{
    color:var(--muted); font-family:var(--font-ui); font-weight:500;
    font-size:var(--t-body-lg); letter-spacing:0; margin-top:var(--space-1)}
  .home-primary{
    color:#fff; border-radius:var(--radius-sm); font-weight:700;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));
    box-shadow:0 6px 16px color-mix(in srgb, var(--brand) 24%, transparent)}
  /* Full-bleed is right on a phone; on desktop the shell is 1180px wide and a
     button that long reads as a banner, not an action. */
  body.layout-desktop .home-primary,
  body.layout-desktop .home-shell-compact .home-primary{max-width:360px}

  /* ── Shift banner: glass-1 with a semantic accent edge ─────────────── */
  .home-shift-start{
    --shift-accent:var(--brand);
    --shift-wash:var(--pine-tint);
    color:var(--ink);
    background:var(--glass);
    border:1px solid var(--line);
    border-left:3px solid var(--shift-accent);
    border-radius:var(--radius);
    box-shadow:var(--shadow-1);
    padding:var(--space-4)}
  .home-shift-start.late{--shift-accent:var(--out); --shift-wash:var(--out-tint);
    background:linear-gradient(var(--shift-wash),var(--shift-wash)),var(--glass)}
  .home-shift-start.done{--shift-accent:var(--in); --shift-wash:var(--pine-tint);
    background:linear-gradient(var(--shift-wash),var(--shift-wash)),var(--glass)}
  .home-shift-kicker,
  .home-shift-start.late .home-shift-kicker{
    color:var(--shift-accent); font-size:var(--t-eyebrow); font-weight:700; letter-spacing:.14em}
  .home-shift-start h2{color:var(--ink); font-size:var(--t-display-md); letter-spacing:-.01em}
  .home-shift-start-head p,
  .home-shift-start.late .home-shift-start-head p{color:var(--muted); font-size:var(--t-body-sm)}
  .home-shift-hint{color:var(--meta); font-size:var(--t-micro); line-height:1.45}

  /* Primary action carries the tone; secondary stays quiet. */
  .home-shift-primary,
  .home-shift-start.late .home-shift-primary{
    color:#fff; border-radius:var(--radius-sm); font-weight:700;
    background:var(--shift-accent);
    box-shadow:0 6px 16px color-mix(in srgb, var(--shift-accent) 26%, transparent)}

  .home-shift-step{
    background:var(--glass-strong); border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:var(--space-2) var(--space-3)}
  .home-shift-step.ok{
    background:var(--pine-tint);
    border-color:color-mix(in srgb, var(--in) 30%, transparent)}
  .home-shift-mark{
    background:var(--glass); border:1px solid var(--line);
    border-radius:10px; color:var(--muted)}
  .home-shift-step.ok .home-shift-mark{background:var(--in); color:#fff; border-color:transparent}
  .home-shift-step-label{color:var(--ink); font-size:var(--t-body-sm); font-weight:600}
  .home-shift-step-done{color:var(--in); font-size:var(--t-micro); font-weight:700}
  .home-shift-step-cta{
    background:#fff; border:1px solid var(--line); color:var(--ink);
    border-radius:10px; font-size:var(--t-caption); font-weight:700}
  .home-shift-step-cta.primary,
  .home-shift-start.late .home-shift-step-cta.primary{
    background:var(--shift-accent); color:#fff; border-color:transparent}

  /* ── Home v2: Figma mast + signal tiles + quieter “Mehr” ───────────── */
  .home-shell-v2{gap:var(--space-3)}
  .home-mast .brand-kicker{
    order:-2; margin:0 0 var(--space-1);
    font-family:var(--font-ui); color:var(--sea);
    font-size:var(--t-eyebrow); font-weight:700; letter-spacing:.14em;
    text-transform:uppercase}
  .home-mast .home-brand{
    order:0; margin:0; color:var(--ink);
    font-family:var(--font-display); font-size:var(--t-display-lg);
    font-weight:700; letter-spacing:-.02em; line-height:1.12}
  .home-mast .home-lede{
    order:1; margin:var(--space-1) 0 0; max-width:36ch;
    color:var(--muted); font-family:var(--font-ui); font-weight:500;
    font-size:var(--t-body-lg); letter-spacing:0}
  .home-cta-row{
    order:2; display:flex; flex-wrap:wrap; gap:var(--space-2);
    margin-top:var(--space-3); width:100%; align-items:center}
  .home-cta-row .home-primary{margin-top:0; width:auto; min-width:min(100%,200px)}
  .home-secondary{
    appearance:none; border:1px solid var(--line); background:var(--glass);
    color:var(--ink); border-radius:var(--radius-sm); min-height:48px;
    padding:0 var(--space-3); font:inherit; font-weight:700; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; touch-action:manipulation}
  .home-secondary:active{transform:scale(.98)}
  .home-signals{
    display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:var(--space-2)}
  @media(max-width:420px){
    .home-signals{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  .home-signal{
    appearance:none; border:1px solid var(--line); background:var(--glass);
    border-radius:var(--radius); padding:var(--space-3); text-align:left;
    cursor:pointer; display:grid; gap:2px; min-width:0; box-shadow:var(--shadow-1);
    color:inherit; font:inherit; touch-action:manipulation}
  .home-signal:active{transform:scale(.98)}
  .home-signal .w-stat-val{font-family:var(--font-display); font-size:1.375rem;
    letter-spacing:-.02em; font-variant-numeric:tabular-nums; color:var(--ink)}
  .home-signal .w-stat-lbl{font-size:12px; color:var(--muted); line-height:1.3}
  .home-signal .w-stat-ico{color:var(--sea)}
  .home-signal.tone-pine{border-left:3px solid var(--brand)}
  .home-signal.tone-out{border-left:3px solid var(--out)}
  .home-signal.tone-sea{border-left:3px solid var(--sea)}
  .home-signal.tone-amber{border-left:3px solid var(--mark-a,#c48a1a)}
  .home-more{
    border:1px solid var(--line); border-radius:var(--radius);
    background:var(--glass); padding:0; box-shadow:var(--shadow-1)}
  .home-more > summary{
    list-style:none; cursor:pointer; padding:var(--space-3) var(--space-4);
    font-weight:700; font-size:var(--t-body-sm); color:var(--muted)}
  .home-more > summary::-webkit-details-marker{display:none}
  .home-more[open] > summary{border-bottom:1px solid var(--line); color:var(--ink)}
  .home-more-grid{padding:var(--space-3); margin:0}
  .home-shell-v2 .home-today-card{
    border:1px solid var(--line); background:var(--glass);
    border-radius:var(--radius); padding:var(--space-3); box-shadow:var(--shadow-1)}

  /* ── Ops shells (Lager / Liste): hero + glass command ──────────────── */
  .ops-hero,.stock-hero,.shop-hero{
    padding:var(--space-2) 0 var(--space-3); color:var(--ink)}
  .ops-hero .brand-kicker,.stock-hero .brand-kicker,.shop-hero .brand-kicker{
    font-family:var(--font-ui); color:var(--sea);
    font-size:var(--t-eyebrow); font-weight:700; letter-spacing:.14em;
    text-transform:uppercase; margin:0 0 var(--space-1)}
  .ops-hero h2,.stock-hero h2,.shop-hero h2{
    margin:0; font-family:var(--font-display); font-size:var(--t-display-lg);
    font-weight:700; letter-spacing:-.02em; color:var(--ink)}
  .ops-hero > p,.stock-hero > p,.shop-hero > p{
    margin:var(--space-1) 0 0; color:var(--muted); font-size:var(--t-body-sm); max-width:40ch}
  .ops-hero-stats{
    display:grid; grid-template-columns:repeat(3,minmax(0,1fr));
    gap:var(--space-2); margin-top:var(--space-3)}
  .ops-hero-stats .w-stat{
    background:var(--glass); border:1px solid var(--line); box-shadow:var(--shadow-1)}
  .stock-shell,.shop-shell{display:flex; flex-direction:column; gap:var(--space-2)}
  .stock-command,.shop-command{
    background:var(--glass)!important; border:1px solid var(--line)!important;
    box-shadow:var(--shadow-1)!important; border-radius:var(--radius)!important}
  .bulk-bar{
    background:linear-gradient(135deg,var(--brand),var(--brand-2))!important;
    border-color:color-mix(in srgb, var(--brand) 40%, transparent)!important;
    box-shadow:0 12px 28px color-mix(in srgb, var(--brand) 28%, transparent)!important}
  .plan-hero .w-minical{margin-top:var(--space-2)}
  .talk-topics.glass-1,.talk-chat-shell.glass-1,
  .gal-shell .gal-compose-bar{
    background:var(--glass); border:1px solid var(--line);
    border-radius:var(--radius); box-shadow:var(--shadow-1); padding:var(--space-3)}
  .book-hero .tide-line{
    background:linear-gradient(90deg,var(--sea),var(--brand));
    -webkit-background-clip:text; background-clip:text; color:transparent}
  @media(prefers-reduced-motion:reduce){
    .book-hero .tide-line{background:none; color:var(--ink); -webkit-background-clip:unset; background-clip:unset}
  }

  /* ── Plan hero: same treatment as Home (Figma "Plan" frame) ────────── */
  .plan-hero{
    background:none; color:var(--ink); box-shadow:none; padding:var(--space-2) 0 var(--space-3);
    border-radius:0; align-items:flex-end}
  .plan-hero .brand-kicker{
    font-family:var(--font-ui); color:var(--sea);
    font-size:var(--t-eyebrow); font-weight:700; letter-spacing:.14em}
  .plan-hero-date{color:var(--ink); font-size:var(--t-display-lg); letter-spacing:-.02em}
  .plan-hero-meet{color:var(--muted); font-size:var(--t-body-sm)}
  .plan-hero-cta{
    color:#fff; border-radius:var(--radius-sm); font-weight:700;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));
    box-shadow:0 6px 16px color-mix(in srgb, var(--brand) 24%, transparent)!important}

  /* ── Zo-Ai launcher: pine, not the pale brand-mark gradient ────────── */
  .zoai-fab{
    background:linear-gradient(135deg,var(--brand),var(--brand-2));
    color:#fff;
    box-shadow:0 10px 28px color-mix(in srgb, var(--brand) 32%, transparent)}
  .zoai-fab .zoai-fab-icon{color:#fff}


  /* ── Liste: the date picker collapsed to 0 width ───────────────────── */
  /* .shop-command-row is nowrap, so the tool buttons ate the row and the
     picker's flex-basis:0 never grew back — its label then overflowed on top
     of the stepper. Give it a real minimum and let it take its own line on a
     phone, which is where the collision showed. */
  .shop-command-row .friday-picker{min-width:168px}
  @media(max-width:560px){
    .shop-command-row{flex-wrap:wrap}
    .shop-command-row .friday-picker{flex:1 1 100%; order:-1}
    .shop-command-row .shop-tools{flex:1 1 100%; justify-content:flex-start}
  }


  /* ── Remaining staff heroes: same treatment as Home and Plan ────────── */
  /* .talk-hero, .book-hero and .gal-hero are the last of the pre-redesign
     dark gradient cards. Kids/arcade heroes are deliberately left alone —
     that surface was rebuilt in v79–v80 and has its own direction. */
  .talk-hero,.book-hero,.gal-hero{
    background:none!important; color:var(--ink); box-shadow:none;
    padding:var(--space-2) 0 var(--space-3); border-radius:0}
  .talk-hero .brand-kicker,.book-hero .brand-kicker,.gal-hero .brand-kicker{
    font-family:var(--font-ui); color:var(--sea);
    font-size:var(--t-eyebrow); font-weight:700; letter-spacing:.14em}
  .talk-hero h2,.book-hero h2,.gal-hero h2{
    color:var(--ink); font-size:var(--t-display-lg); letter-spacing:-.02em}
  .talk-hero p,.book-hero p,.gal-hero p{
    color:var(--muted); font-size:var(--t-body-sm)}

  /* mark-a on stone fails contrast now the hero is light, not dark. */
  .gal-hero .gal-safe-line{color:var(--sea)}
  .gal-hero .gal-drive-line{color:var(--muted)}


  /* ══════════════════════════════════════════════════════════════════════
     RESPONSIVE — every aspect ratio, not just phone-or-desktop
     The app had one binary switch at 900px, so an iPad at 768px got the phone
     layout with a 748px-wide "floating" dock pill stretched across the bottom.
     Five tiers now, plus landscape and reduced-height handling. CSS only —
     app.js still owns the layout-mobile / layout-desktop class.
     ══════════════════════════════════════════════════════════════════════ */

  :root{
    --shell-measure:1180px;   /* comfortable reading width for ops content */
    --dock-max:560px;         /* a floating pill stops being a pill past this */
  }

  /* Whenever the dock is the bottom pill (any width that is not the desktop
     rail), cap and centre it. Without this it stretched to 748px on an iPad and
     1004px on a 1024 window — a phone control blown up, not a tablet one.
     On phones the calc goes negative and max() falls back to the inset. */
  body:not(.layout-desktop) .bottom-panel{
    max-width:none;
    padding-inline:max(var(--nav-inset), calc((100vw - var(--dock-max)) / 2));
  }
  body:not(.layout-desktop) .zoai-fab,
  body:not(.layout-desktop) .chat-panel.chat-float{
    right:max(var(--nav-inset), calc((100vw - var(--dock-max)) / 2));
  }

  /* ── Compact phones: iPhone SE, folded foldables (<=359) ───────────── */
  @media (max-width:359px){
    :root{ --page-x:12px; }
    main.app-stage{padding-inline:12px}
    nav.dock button{font-size:9px; gap:2px}
    .nav-ico{width:19px;height:19px}
    .dashboard-grid{grid-template-columns:1fr; gap:var(--space-2)}
    .home-mast .home-brand{font-size:clamp(24px,7vw,30px)}
  }

  /* ── Tablet portrait (600–899): the tier that was missing ──────────── */
  @media (min-width:600px) and (max-width:899px){
    /* Content gets a measure instead of running the full 768px. */
    main.app-stage{max-width:720px; margin-inline:auto; padding-inline:var(--space-6)}
    header.app-chrome > .topbar-row{max-width:720px; margin-inline:auto; width:100%}
    .dashboard-grid{grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--space-3)}
    .dashboard-grid .wide{grid-column:1/-1}
    /* Three across reads better than two on a 768 canvas. */
    .stock-product-grid:not(.tiles){grid-template-columns:repeat(2,minmax(0,1fr))}
    .zoai-fab{right:max(var(--space-6), calc((100vw - var(--dock-max)) / 2))}
  }

  /* ── Tablet landscape / small desktop (900–1279) ───────────────────── */
  @media (min-width:900px) and (max-width:1279px){
    main.app-stage{max-width:900px}
    .dashboard-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  }

  /* ── Large desktop (>=1600): stop the shell sprawling ──────────────── */
  @media (min-width:1600px){
    #app.app-shell{max-width:var(--shell-measure)}
    main.app-stage{max-width:1080px; margin-inline:auto}
    .dashboard-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  }

  /* ── Landscape phone: vertical space is the scarce axis ────────────── */
  @media (orientation:landscape) and (max-height:500px){
    :root{ --header-h:48px; --nav-h:52px; }
    header.app-chrome{padding-top:calc(var(--space-1) + var(--safe-t)); padding-bottom:var(--space-1)}
    header.app-chrome .who{display:none}
    .home-mast{padding-block:var(--space-1) var(--space-2)}
    .home-mast .home-brand{font-size:clamp(20px,4vw,26px)}
    .home-mast h2{font-size:var(--t-body-sm)}
    nav.dock button{gap:1px}
    nav.dock button span{font-size:9px}
    .nav-ico{width:18px;height:18px}
    /* Two columns even on a short screen — vertical scrolling is the cost here. */
    .dashboard-grid{grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--space-2)}
    .sheet{max-height:96dvh}
  }

  /* ── Very short viewports of any width (split-screen, small windows) ── */
  @media (max-height:420px){
    .home-shift-start{padding:var(--space-3)}
    .home-shift-steps{gap:2px}
  }

  /* ── Foldable unfolded / square-ish ratios ─────────────────────────── */
  @media (min-aspect-ratio:1/1) and (max-width:1100px){
    main.app-stage{max-width:min(100%, 860px)}
  }


  /* ══════════════════════════════════════════════════════════════════════
     KIDS — Bewertungen, Bonus, Notizen (Figma Kids frames)
     Sea-led per the design doc's Kids board; amber only where the child has
     actually earned something.
     ══════════════════════════════════════════════════════════════════════ */
  .kid-card{
    background:var(--glass); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow-1); padding:var(--space-4); margin-bottom:var(--space-3);
    display:grid; gap:var(--space-2)}
  .kid-card h2{font-family:var(--font-display); font-size:var(--t-display-sm);
    font-weight:600; margin:0; letter-spacing:0}

  /* Ratings — German school grades 1–6 -------------------------------- */
  .kid-rate-row{display:flex; align-items:flex-start; gap:var(--space-3); min-height:44px; flex-wrap:wrap}
  .kid-rate-label{flex:1; min-width:7rem; font-size:var(--t-body-sm); color:var(--ink); padding-top:8px}
  .kid-grades{display:flex; flex-direction:column; gap:4px; flex:1 1 220px; align-items:flex-end}
  .kid-rate-group{display:grid; gap:var(--space-2); margin-top:var(--space-2)}
  .kid-rate-group .eyebrow{margin:0}
  .grade-scale-legend{font-size:var(--t-caption); margin:0 0 var(--space-2)}
  .grade-pick-row{display:inline-flex; gap:4px; flex-wrap:wrap; justify-content:flex-end}
  .grade-pick{
    width:36px; height:36px; padding:0; border:1px solid var(--line); border-radius:10px;
    background:var(--glass-strong, var(--glass)); color:var(--ink-muted, var(--muted));
    cursor:pointer; display:grid; place-items:center;
    font-family:var(--font-display); font-weight:700; font-size:var(--t-body-sm);
    font-variant-numeric:tabular-nums;
    transition:transform var(--m-base) var(--ease-settle), background var(--m-base) var(--ease-settle),
      border-color var(--m-base) var(--ease-settle), color var(--m-base) var(--ease-settle)}
  button.grade-pick:active{transform:scale(.92); transition-duration:var(--m-fast)}
  .grade-pick .grade-num{line-height:1}
  .grade-pick.on{
    background:var(--pine-wash, rgba(42,107,82,.12)); border-color:var(--brand);
    color:var(--brand); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--brand) 35%, transparent)}
  .kid-grades.sea .grade-pick.on{background:color-mix(in srgb, var(--sea) 14%, transparent); border-color:var(--sea); color:var(--sea)}
  .kid-grades.pine .grade-pick.on{background:var(--pine-wash, rgba(42,107,82,.12)); border-color:var(--brand); color:var(--brand)}
  .kid-grades.mark .grade-pick.on{background:color-mix(in srgb, var(--mark-b) 18%, transparent); border-color:var(--mark-b); color:var(--sea)}
  .kid-grades.sun .grade-pick.on{background:var(--amber-tint); border-color:var(--sun); color:#7a5a10}
  .grade-pick:focus-visible{outline:none; box-shadow:var(--focus)}
  .grade-pick-hint{font-size:var(--t-micro); color:var(--meta); text-align:right; width:100%}
  .grade-chip{
    display:inline-grid; gap:1px; justify-items:end; padding:4px 8px;
    border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--glass);
    font-variant-numeric:tabular-nums}
  .grade-chip b{font-family:var(--font-display); font-size:var(--t-display-sm); color:var(--brand); line-height:1}
  .grade-chip small{font-size:var(--t-micro); color:var(--meta)}
  .grade-chip.muted{color:var(--meta)}
  .grade-rate-row{align-items:flex-start}
  .grade-rate-row .grow{padding-top:8px}
  .kid-rate-due{background:linear-gradient(var(--amber-tint),var(--amber-tint)),var(--glass);
    border-color:color-mix(in srgb, var(--sun) 34%, transparent)}
  .kid-rate-due-row{display:flex; align-items:center; gap:var(--space-3)}
  .kid-rate-due-ico{flex:0 0 auto; color:var(--sun)}
  .kid-rate-due-row .grow{display:grid; gap:2px}
  .kid-rate-due-row b{font-size:var(--t-body-sm)}

  /* Legacy decorative XP stars (bonus) */
  .kid-stars{display:inline-flex; gap:3px; flex:0 0 auto}
  .kid-star{
    width:34px; height:34px; padding:5px; border:0; background:none;
    display:grid; place-items:center; border-radius:10px}
  .kid-star svg{width:100%; height:100%; fill:color-mix(in srgb, var(--ink) 14%, transparent)}
  .kid-stars.sea  .kid-star.on svg{fill:var(--sea)}
  .kid-stars.pine .kid-star.on svg{fill:var(--brand)}
  .kid-stars.mark .kid-star.on svg{fill:var(--mark-b)}
  .kid-stars.sun  .kid-star.on svg{fill:var(--sun)}
  .kid-star:focus-visible{outline:none; box-shadow:var(--focus)}

  .kid-trend-row{display:flex; align-items:center; gap:var(--space-3)}
  .kid-trend-wk{width:46px; flex:0 0 auto; font-size:var(--t-micro); color:var(--meta);
    font-variant-numeric:tabular-nums}
  .kid-trend-track{flex:1; min-width:0; height:6px; border-radius:3px;
    background:color-mix(in srgb, var(--ink) 8%, transparent); overflow:hidden}
  .kid-trend-fill{display:block; height:100%; border-radius:3px; background:var(--sun)}
  .kid-trend-val{width:28px; flex:0 0 auto; text-align:right;
    font-size:var(--t-caption); font-weight:700; color:var(--ink);
    font-variant-numeric:tabular-nums}

  /* Bonus ------------------------------------------------------------ */
  .kid-bonus-hero{
    grid-auto-flow:column; grid-template-columns:auto 1fr; align-items:center;
    background:linear-gradient(var(--amber-tint),var(--amber-tint)),var(--glass);
    border-color:color-mix(in srgb, var(--sun) 34%, transparent)}
  .kid-bonus-stars{display:inline-flex; gap:2px; color:var(--sun); font-size:28px}
  .kid-bonus-stars .ui-ico{width:28px;height:28px}
  .kid-bonus-stars .kid-star{width:26px;height:26px;pointer-events:none}
  .kid-bonus-stars .kid-star.on svg{fill:var(--sun)}
  .kid-bonus-copy{display:grid; gap:2px; min-width:0}
  .kid-bonus-copy b{font-family:var(--font-display); font-size:var(--t-display-md);
    font-weight:600; color:var(--ink)}
  .kid-bonus-copy span{font-size:var(--t-body-sm); color:#7a5a10}
  .kid-bonus-row{
    display:flex; align-items:center; gap:var(--space-3);
    padding:var(--space-2) var(--space-3); border-radius:var(--radius-sm);
    background:color-mix(in srgb, var(--ink) 3%, transparent); min-height:44px}
  .kid-bonus-row.done{background:var(--pine-tint)}
  .kid-bonus-mark{
    width:22px;height:22px;flex:0 0 auto;border-radius:7px;display:grid;place-items:center;
    background:#fff; border:1px solid color-mix(in srgb, var(--ink) 16%, transparent);
    font-size:var(--t-micro); font-weight:800; color:#fff}
  .kid-bonus-row.done .kid-bonus-mark{background:var(--in); border-color:transparent}
  .kid-bonus-label{flex:1; min-width:0; font-size:var(--t-body-sm); color:var(--muted)}
  .kid-bonus-row.done .kid-bonus-label{color:var(--ink)}
  .kid-bonus-pts{flex:0 0 auto; font-size:var(--t-caption); font-weight:700; color:var(--meta);
    font-variant-numeric:tabular-nums}
  .kid-bonus-row.done .kid-bonus-pts{color:var(--in)}

  /* Notes ------------------------------------------------------------ */
  .kid-moods{display:flex; gap:var(--space-2)}
  .kid-mood{
    flex:1; min-height:44px; border-radius:var(--radius-pill); cursor:pointer;
    border:1px solid var(--line); background:#fff; color:var(--muted);
    font:inherit; font-size:var(--t-caption); font-weight:600;
    transition:transform var(--m-base) var(--ease-settle), background-color var(--m-fast) linear}
  .kid-mood:active{transform:scale(.98); transition-duration:var(--m-fast)}
  .kid-mood:focus-visible{outline:none; box-shadow:var(--focus)}
  .kid-mood.in.on  {background:var(--pine-tint);  border-color:color-mix(in srgb,var(--in) 42%,transparent);  color:var(--in)}
  .kid-mood.warn.on{background:var(--amber-tint); border-color:color-mix(in srgb,var(--warn) 42%,transparent); color:var(--warn)}
  .kid-mood.out.on {background:var(--out-tint);   border-color:color-mix(in srgb,var(--out) 42%,transparent);  color:var(--out)}
  .kid-note-input{
    width:100%; border:1px solid var(--line-strong); border-radius:var(--radius-sm);
    background:#fff; color:var(--ink); padding:var(--space-3); resize:vertical;
    font:inherit; line-height:1.45}
  .kid-note{border-left:3px solid var(--line)}
  .kid-note.in{border-left-color:var(--in)}
  .kid-note.warn{border-left-color:var(--warn)}
  .kid-note.out{border-left-color:var(--out)}
  .kid-note-head{display:flex; align-items:center; gap:var(--space-2)}
  .kid-note-date{flex:1; min-width:0; font-size:var(--t-caption); font-weight:700; color:var(--ink)}
  .kid-note-mood{
    flex:0 0 auto; padding:2px var(--space-2); border-radius:var(--radius-pill);
    font-size:var(--t-eyebrow); font-weight:700; text-transform:uppercase; letter-spacing:.08em;
    background:color-mix(in srgb, var(--ink) 5%, transparent); color:var(--muted)}
  .kid-note p{margin:0; font-size:var(--t-body-sm); color:var(--muted); line-height:1.45}

  /* Wider screens: ratings and bonus read better side by side. */
  @media (min-width:600px){
    .kid-rate-row{max-width:520px}
    .kid-moods{max-width:420px}
    .kid-note-input{max-width:520px}
  }


  /* ── UI icon set — replaces emoji used as chrome ────────────────────
     The design doc lists emoji-as-iconography as a placeholder to replace.
     Stroke icons, sized explicitly (an unsized inline <svg> defaults to
     ~300px), colour following currentColor like .nav-ico. */
  .ui-ico{width:20px; height:20px; display:inline-block; vertical-align:-.22em;
    flex:0 0 auto; fill:none; stroke:currentColor}
  .ui-ico.sm{width:14px; height:14px; vertical-align:-.12em}
  .ui-ico.lg{width:28px; height:28px}
  .ui-ico.xl{width:40px; height:40px; stroke-width:1.4}
  .empty-ico .ui-ico{width:44px; height:44px; stroke-width:1.3; color:var(--sea); opacity:.85}
  .btn .ui-ico, .page-act .ui-ico, .chip .ui-ico{margin-right:6px}

  /* ── Widget catalogue (ring / sparkline / stat / minical) ───────────── */
  .w-tone-pine{--w-tone:var(--brand)}
  .w-tone-sea{--w-tone:var(--sea)}
  .w-tone-amber{--w-tone:var(--sun)}
  .w-ring{--w-tone:var(--brand); --w-pct:0; position:relative; width:48px; height:48px; border-radius:50%;
    background:conic-gradient(var(--w-tone) calc(var(--w-pct) * 1%), var(--stone-200) 0);
    display:grid; place-items:center; flex:0 0 auto}
  .w-ring::before{content:'';position:absolute; inset:6px; border-radius:50%; background:#fff}
  .w-ring-label{position:relative;z-index:1;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;
    color:var(--ink); line-height:1; max-width:34px; text-align:center; overflow:hidden; text-overflow:ellipsis}
  .w-spark{display:block; width:64px; height:28px; --w-tone:var(--brand); overflow:visible}
  .w-spark polyline{stroke:var(--w-tone); stroke-width:2px; stroke-linecap:round; stroke-linejoin:round;
    vector-effect:non-scaling-stroke; fill:none}
  .w-stat{display:grid; gap:2px; min-width:0; padding:var(--space-3); border-radius:var(--radius);
    background:var(--glass-strong); border:1px solid var(--line); box-shadow:var(--shadow-1)}
  .w-stat-ico{color:var(--sea)}
  .w-stat-val{font-family:var(--font-display);font-size:1.375rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
    color:var(--ink); line-height:1.1}
  .w-stat-val.up{color:var(--brand)}
  .w-stat-val.down{color:var(--out)}
  .w-stat-lbl{font-size:12px;color:var(--muted);line-height:1.3}
  .w-minical{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  .w-minical > i{display:grid;place-items:center;aspect-ratio:1;border-radius:var(--radius-sm);
    font-size:11px;font-weight:700;font-style:normal;font-variant-numeric:tabular-nums;
    color:var(--muted);background:var(--stone-100);border:1px solid transparent}
  .w-minical > i.on{background:var(--pine-tint);color:var(--brand);border-color:color-mix(in srgb,var(--brand) 22%, transparent)}
  .w-minical > i.active{box-shadow:0 0 0 2px color-mix(in srgb,var(--sea) 35%, transparent)}


  /* Persistent, unmissable while durable storage is down. Staff were being
     shown a successful save for a write that only reached /tmp. */
  body.storage-offline #app.app-shell::before{
    content:attr(data-storage-warning);
    position:sticky; top:0; z-index:30; display:block;
    padding:var(--space-2) var(--space-4);
    background:var(--out); color:#fff;
    font:600 var(--t-caption)/1.35 var(--font-ui); text-align:center}


  /* ══════════════════════════════════════════════════════════════════════
     STAFF LIQUID GLASS 2026 — matches Figma Staff Prototype
     Last in cascade so early legacy dark heroes cannot win.
     ══════════════════════════════════════════════════════════════════════ */
  body:not(.mode-child){
    --staff-glass:rgba(255,255,255,.48);
    --staff-glass-edge:rgba(255,255,255,.70);
    --staff-radius:24px;
  }
  body:not(.mode-child) .view{
    background:
      radial-gradient(120% 80% at 100% 0%, color-mix(in srgb, var(--sea) 8%, transparent), transparent 55%),
      linear-gradient(180deg, var(--stone-50, #f3f5f2), var(--bg));
  }
  body:not(.mode-child) nav.dock{
    background:rgba(26,40,34,.88)!important;
    border:1px solid rgba(255,255,255,.14)!important;
    border-radius:28px!important;
    padding:8px!important;
    backdrop-filter:blur(28px) saturate(1.25)!important;
    -webkit-backdrop-filter:blur(28px) saturate(1.25)!important;
    box-shadow:0 16px 40px rgba(26,40,34,.32), inset 0 1px 0 rgba(255,255,255,.12)!important;
  }
  body:not(.mode-child) nav.dock button{
    color:rgba(255,255,255,.55)!important;
    border-radius:18px!important;
    gap:4px!important;
  }
  body:not(.mode-child) nav.dock button.on{
    color:var(--mark-a)!important;
    background:rgba(255,255,255,.12)!important;
    box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--mark-a) 28%, transparent)!important;
  }
  body:not(.mode-child) .home-shell-v2{
    gap:var(--space-4);
    max-width:720px;
  }
  body:not(.mode-child) .home-mast .home-brand{
    font-size:clamp(30px,8vw,40px)!important;
    letter-spacing:-.03em!important;
  }
  body:not(.mode-child) .home-primary{
    min-height:52px!important;
    border-radius:16px!important;
    padding:0 22px!important;
    box-shadow:0 10px 28px color-mix(in srgb, var(--brand) 32%, transparent)!important;
  }
  body:not(.mode-child) .home-signal,
  body:not(.mode-child) .home-shell-v2 .home-today-card,
  body:not(.mode-child) .home-shift-start,
  body:not(.mode-child) .home-more,
  body:not(.mode-child) .ops-hero-stats .w-stat,
  body:not(.mode-child) .stock-command,
  body:not(.mode-child) .shop-command,
  body:not(.mode-child) .talk-topics.glass-1,
  body:not(.mode-child) .talk-chat-shell.glass-1{
    background:var(--staff-glass)!important;
    border:1px solid var(--staff-glass-edge)!important;
    border-radius:var(--staff-radius)!important;
    backdrop-filter:blur(22px) saturate(1.15);
    -webkit-backdrop-filter:blur(22px) saturate(1.15);
    box-shadow:0 12px 32px rgba(26,40,34,.08), inset 0 1px 0 rgba(255,255,255,.55)!important;
  }
  body:not(.mode-child) .home-signal.tone-pine{border-left:3px solid var(--brand)!important}
  body:not(.mode-child) .home-signal.tone-out{border-left:3px solid var(--out)!important}
  body:not(.mode-child) .home-signal.tone-sea{border-left:3px solid var(--sea)!important}
  body:not(.mode-child) .home-signal.tone-amber{border-left:3px solid var(--sun)!important}
  body:not(.mode-child) .home-shift-start{
    border-left:3px solid var(--brand)!important;
  }
  body:not(.mode-child) .home-today-card .task-list > *{
    background:rgba(255,255,255,.88);
    border:1px solid var(--line);
    border-radius:14px;
    margin-bottom:8px;
  }
  body:not(.mode-child) .zoai-fab{
    width:58px!important; height:58px!important;
    background:linear-gradient(135deg,var(--brand),var(--brand-2))!important;
    color:#fff!important;
    box-shadow:0 12px 28px color-mix(in srgb, var(--brand) 36%, transparent)!important;
  }
  body:not(.mode-child) .zoai-fab .zoai-fab-icon{display:none}
  body:not(.mode-child) .zoai-fab::after{
    content:"Zo"; font-family:var(--font-ui); font-weight:800; font-size:14px;
    letter-spacing:-.02em; color:#fff;
  }
  body.chat-open:not(.mode-child) .zoai-fab::after{content:"×"; font-size:22px; font-weight:300}
  body:not(.mode-child) .chat-panel.chat-float{
    background:rgba(255,255,255,.72)!important;
    backdrop-filter:blur(28px) saturate(1.2)!important;
    -webkit-backdrop-filter:blur(28px) saturate(1.2)!important;
    border:1px solid var(--staff-glass-edge)!important;
    border-radius:24px!important;
    box-shadow:0 20px 48px rgba(26,40,34,.18)!important;
  }
  body:not(.mode-child) .plan-hero,
  body:not(.mode-child) .book-hero,
  body:not(.mode-child) .gal-hero,
  body:not(.mode-child) .talk-hero{
    background:none!important; color:var(--ink)!important; box-shadow:none!important;
  }

  /* Mobile Glass 2026 — Figma page 07: light frosted header, ink controls */
  body:not(.mode-child) header.app-chrome{
    background:rgba(255,255,255,.52)!important;
    color:var(--ink)!important;
    border-bottom:1px solid rgba(26,40,34,.08)!important;
    box-shadow:0 8px 24px rgba(26,40,34,.06)!important;
    backdrop-filter:blur(24px) saturate(1.35)!important;
    -webkit-backdrop-filter:blur(24px) saturate(1.35)!important;
  }
  body:not(.mode-child) header.app-chrome::before{
    opacity:.45!important;
    background:linear-gradient(120deg,
      color-mix(in srgb, var(--mark-a) 10%, transparent),
      transparent 50%,
      color-mix(in srgb, var(--sea) 8%, transparent))!important;
  }
  body:not(.mode-child) .brand-kicker-live{color:var(--sea)!important}
  body:not(.mode-child) header h1{color:var(--ink)!important}
  body:not(.mode-child) header .who{color:var(--muted)!important; opacity:1}
  body:not(.mode-child) .topbtn{
    border:1px solid rgba(26,40,34,.12)!important;
    background:rgba(255,255,255,.78)!important;
    color:var(--ink)!important;
    min-height:44px!important;
    min-width:44px;
    box-shadow:0 4px 12px rgba(26,40,34,.05);
  }
  body:not(.mode-child) .topbtn-bell .bell-count{
    background:var(--sun); color:var(--ink);
  }
  body:not(.mode-child) nav.dock button{
    min-height:48px;
    pointer-events:auto;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }

  @media (prefers-reduced-transparency: reduce){
    body:not(.mode-child) header.app-chrome{
      backdrop-filter:none!important; -webkit-backdrop-filter:none!important;
      background:var(--glass-strong)!important;
    }
    body:not(.mode-child) .home-signal,
    body:not(.mode-child) .home-shell-v2 .home-today-card,
    body:not(.mode-child) .home-shift-start,
    body:not(.mode-child) nav.dock{
      backdrop-filter:none!important; -webkit-backdrop-filter:none!important;
      background:var(--glass-strong)!important;
    }
    body:not(.mode-child) nav.dock{background:var(--chrome)!important}
  }


  /* ── Staff expansion v102–v104 ─────────────────────────────────────── */
  body:not(.mode-child) .hero-texture,
  body:not(.mode-child) .home-mast,
  body:not(.mode-child) .plan-hero,
  body:not(.mode-child) .ops-hero,
  body:not(.mode-child) .kids-hero,
  body:not(.mode-child) .kid-profile-mast{
    position:relative;

  /* Elevation aliases siblings may attach without inventing new tokens */
  .glass-1{
    background:var(--glass); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow-1); backdrop-filter:blur(var(--blur-1)) saturate(1.15);
    -webkit-backdrop-filter:blur(var(--blur-1)) saturate(1.15)}
  .glass-2{
    background:var(--glass-strong); border:1px solid var(--line); border-radius:var(--radius-lg);
    box-shadow:var(--shadow-2), inset 0 1px 0 var(--glass-rim);
    backdrop-filter:blur(var(--blur-2)) saturate(1.2);
    -webkit-backdrop-filter:blur(var(--blur-2)) saturate(1.2)}

  /* Arcade hero: kill teal/cyan neon — sea-deep stone like kid-header (§0) */
  .arcade-hero{
    color:#fff;
    background:
      linear-gradient(145deg, color-mix(in srgb, var(--sea-deep) 88%, #000), transparent 55%),
      linear-gradient(135deg, var(--sea-deep) 0%, var(--sea) 52%, var(--brand) 100%);
    box-shadow:var(--shadow-1)}
  .arcade-hero .brand-kicker{
    color:color-mix(in srgb, #fff 72%, var(--mark-a));
    letter-spacing:.14em; font-size:var(--t-eyebrow)}
  .arcade-hero h2{color:#fff}
  .arcade-hero p{color:color-mix(in srgb, #fff 72%, transparent)}
  .arcade-streak{
    background:color-mix(in srgb, #fff 12%, transparent);
    border-color:color-mix(in srgb, #fff 22%, transparent)}
  .arcade-mode-btn{
    border:1px solid var(--line); border-radius:var(--radius-sm);
    background:var(--glass-strong); color:var(--ink)}
  .arcade-mode-btn.on{background:var(--brand); border-color:var(--brand); color:#fff}
  .arcade-mode-btn.ai{
    background:linear-gradient(135deg,var(--brand),var(--brand-2)); border:0; color:#fff}

  .entry-sec{

    gap:var(--space-2); margin:0 0 var(--space-2)}

  .empty-state{

  /* Tide-line reveal — remaining heroes (§5.1) */
  .ops-hero > *,.kids-hero > *,.arcade-hero > *,.plan-hero > *,.book-hero > *,

    animation:tide-reveal var(--m-reveal) var(--ease-tide) both}
  .ops-hero > *:nth-child(2),.kids-hero > *:nth-child(2),.arcade-hero > *:nth-child(2),
  .plan-hero > *:nth-child(2),.stock-hero > *:nth-child(2),.shop-hero > *:nth-child(2),

  .ops-hero > *:nth-child(3),.kids-hero > *:nth-child(3),.arcade-hero > *:nth-child(3),
  .plan-hero > *:nth-child(3),.stock-hero > *:nth-child(3),.shop-hero > *:nth-child(3),
